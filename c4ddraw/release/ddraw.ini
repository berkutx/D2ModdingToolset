; ============================================================================
;  C4dll-R default ddraw.ini for Disciples II
;
;  Comments MUST stay on their own lines: the parser takes everything after
;  '=' as the value, so an inline comment (or a trailing space) breaks the
;  setting. Most values below can be changed from the in-game menu
;  (Video / Performance); the menu writes them back into this file.
;
;  If this file is missing, C4dll-R generates another Disciples II-tuned
;  first-run config (bordered game-resolution-sized window, OpenGL, maxgameticks=180).
;  Keep this release copy for automatic output sizing and saved window geometry.
; ============================================================================
[ddraw]

; --- display ----------------------------------------------------------------
; the game checks for a 16-bit desktop; this fakes it (DisciplesGL did too)
fake_mode=1024x768x16
; opengl = shaders + best upscaling (menu: Video > Renderer). If OpenGL is
; unavailable on your system, cnc-ddraw falls back to GDI automatically.
; Alternatives: auto (picks D3D9 first, no shaders), gdi
renderer=opengl
; start windowed, with a title bar and the C4dll-R menu under it
; (menu: Video > Display mode; F4 or Alt+Enter toggles fullscreen)
windowed=true
fullscreen=false
border=true
resizable=true
; 0 = follow Video > Resolution game view. Resolution > Window/output saves a fixed pair.
; Borderless fullscreen uses the desktop. Fixed values only scale the selected
; game view; with adjmouse=true they may be smaller than it. They never change
; how much of the map is visible.
width=0
height=0
; Video > Scaling / aspect is one radio choice:
; Fit = maintas true / boxing false; preserve the selected game aspect
maintas=true
; Integer = boxing true; at 2x one game pixel becomes a 2x2 block (4 pixels).
; If 2x does not fit, cnc-ddraw uses centered exact 1x with large borders.
boxing=false
; non-empty is a custom override; choosing Fit / Integer clears it
aspect_ratio=
; OpenGL shader; Lanczos/Bicubic/Bilinear/None also set the D3D9/GDI fallback
; (menu: Video > Filter)
shader=Shaders\interpolation\lanczos2-sharp.glsl
; 0 nearest, 1 linear, 2 cubic, 3 Lanczos; used by Auto/D3D9 and GDI fallback
d3d9_filter=3
; remember window size/position/state on exit
savesettings=1

; --- performance ------------------------------------------------------------
; game loop cap, ticks per second (menu: Performance > Game speed cap).
; IMPORTANT: low values make the whole game respond slowly - every game
; command is pumped through the engine at this rate. 180 = shipped default,
; 30 = cool CPU but visibly sluggish, -1 = uncapped (hot CPU).
; The C4dll-R menu can reconfigure this limiter live.
maxgameticks=180
; render FPS cap; -1 = screen refresh rate (menu: Performance > Frame cap)
maxfps=-1
; vsync is only needed against tearing in EXCLUSIVE fullscreen; windowed and
; borderless modes never tear (DWM composition). Costs a little display lag.
vsync=false
; 1 CPU stability mode: helps prevent random crashes/freezes on maps.
; Enabled by default. Performance > 1 CPU stability changes the next-start
; setting; a full game restart is required.
singlecpu=true
; keep rendering when the window loses focus
noactivateapp=true
; no exclusive DirectDraw cooperative level (reliable menus/videos)
nonexclusive=true

; --- mouse ------------------------------------------------------------------
; scale the cursor to the window; required for correct input while downscaling
adjmouse=true
; do not lock the cursor to the window (original windowed behavior);
; if it ever locks: Ctrl+Tab or Right-Alt+Right-Ctrl releases it
devmode=true

; --- hotkeys (VK codes; 0x00 disables) ---------------------------------------
; Alt+Enter: windowed <-> fullscreen
keytogglefullscreen=0x0D
; Alt+PgDn: maximize
keytogglemaximize=0x22
; Ctrl+Tab: release cursor
keyunlockcursor1=0x09
; Right-Alt+Right-Ctrl: release cursor
keyunlockcursor2=0xA3
; PrintScreen: screenshot (also: Video > Screenshot)
keyscreenshot=0x2C

; --- advanced (fine as is for Disciples II) ----------------------------------
resolutions=0
fixchilds=2
