; C4dll-R plugin settings. Place this file next to Discipl2.exe.
; Read by C4dll-R.dll (the plugin host). Lines starting with ';' are comments.
; Menu changes and Ctrl+Alt timer dragging apply live and are saved here. If you edit this file
; manually, fully restart the game so the plugins load the new values. See C4PLUGINS.txt.

[Timer]
; Turn timer (Mods\timer.c4p).
;   0 = off
;   1 = count up (stopwatch)
;   2 = count down (per-turn budget)
Enabled=2

; Simple mode day-boundary mask: 1/2/4 = start Pause/Unpause/Reset;
; 8/16/32 = end Pause/Unpause/Reset. Default 10 = start Unpause + end Pause.
DayTurn=10

; PvP billing: local choices always count; opponent phases never count. Local attack playback
; counts only when PauseAnimation=0. Mandatory second-target choices always count.
; Defaults additionally pause the whole human-vs-human battle via PauseOn=1.
; Any effective pause draws the timer white. Only an explicit user Pause adds "(пауза)";
; combat, animation, ownership and timeout pauses do not add the label.
PauseAnimation=1
PauseOn=1

; Non-PvP can run below zero through combat/reward screens. TurnDay=1 queues End Day once and waits
; for a real strategic return; the signed debt is banked for that player's next turn.
; PvP clamps at 00:00. AutoBattle=1 switches the current battle's native Auto Battle toggle through
; its normal callback. The battle-instance/side latch cannot be bypassed by click, hotkey or another
; manual battle action until that battle ends; chat and unrelated keyboard/mouse input stay usable.
; If a defender reaches 00:00 outside their strategic turn, their next accepted turn is a new day
; with one fresh TableDuration budget. Each later PvP battle/choice generation reasserts the native
; lock only when needed; Set/Reset and timeout-option changes cannot cancel the reached timeout.
; Defend/Retreat are not timeout actions in this build.
TurnDay=1
AutoBattle=1
; 0 keeps signed credit/debt. 1 discards only positive spare time; negative PvE debt remains.
ResetExtraTime=0

; Countdown length per turn, in seconds (used when Enabled=2). 300 = 5 minutes.
TableDuration_0=300

; Optional timetable overrides (also editable live through Plugins > Timer > Timetable).
;TableActive_1=1
;TableDay_1=20
;TableDuration_1=240

; 1 = always show the timer; 0 = show only while a turn is in progress.
AlwaysVisible=1

; Force mode warning: 10..45 seconds, in steps of 5. Missing/invalid = 20 (as in 1.9).
BlinkSeconds=20
; One quiet 300 ms tone when the running countdown enters the warning interval.
; 0 = off (also when missing); 1 = on. Pauses do not repeat the tone.
WarningSound=0

; On-screen position, as a percent of the free space. Hold Ctrl+Alt and drag the
; timer with the left mouse button to place it precisely.
;   0 = left / top, 50 = centre, 100 = right / bottom.
; Dragging also writes AnchorX10000/AnchorY10000 (0..10000), which take precedence.
AnchorX=0
AnchorY=0

; Font height in pixels.
FontSize=28

[TwitchStat]
; Battle cards for the separate Disciples II Battle Info Twitch extension.
; Enabled starts capture and the built-in loopback bridge at 127.0.0.1:8765.
; No Node.js or standalone bridge is required. This does not start a stream.
; Keep existing config values when upgrading; do not replace/reset the whole file.
; Missing Enabled uses legacy [UnitInfo] Enabled if present, otherwise 1.
; Live switch: Plugins > Twitch Stat > Enabled. See TWITCH-STREAMER-RU.md for Twitch setup.
Enabled=1
; Local diagnostic JSON preview is unnecessary for streaming; missing = 0.
Preview=0
; 0 = continuous capture; 1 = diagnostic timing; 2 = stop after 20 captures.
; Keep 0 for streaming; missing = 0.
Profile=0
