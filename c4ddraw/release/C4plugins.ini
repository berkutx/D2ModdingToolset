; C4dll-R plugin settings. Place this file next to Discipl2.exe.
; Read by C4dll-R.dll (the plugin host). Lines starting with ';' are comments.

[Timer]
; Turn timer (Mods\timer.c4p).
;   0 = off
;   1 = count up (stopwatch)
;   2 = count down (per-turn budget)
Enabled=2

; Countdown length per turn, in seconds (used when Enabled=2). 300 = 5 minutes.
Duration=300

; 1 = always show the timer; 0 = show only while a turn is in progress.
AlwaysVisible=1

; On-screen position, as a percent of the free space.
;   0 = left / top, 50 = centre, 100 = right / bottom.
AnchorX=0
AnchorY=0

; Font height in pixels.
FontSize=28
