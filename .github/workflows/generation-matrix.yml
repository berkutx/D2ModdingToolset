name: generation-matrix

# Generate and load every random-scenario template under one requested harness profile, one job
# per template and five sequential real game-client attempts per job. Attempts 1-4 must generate;
# attempt 5 must additionally accept and load an actionable strategic map. A CRT assert, sol3 panic,
# generator error, timeout, or unplayable result is a real failure. The source is either the
# latest bartonsun/D2-Templates snapshot resolved by the caller, or the Templates directory
# shipped in the pinned game fixture. fail-fast:false keeps all evidence flowing.

on:
  workflow_call:
    inputs:
      dll_run_id:
        description: "test-harness run id containing the requested DLL artifact"
        # github.run_id is a string expression. Validate its numeric shape in setup instead of making
        # reusable-workflow dispatch fail before the setup job can report a useful error.
        type: string
        required: true
      dll_artifact:
        description: "harness DLL artifact to execute"
        type: string
        required: true
      profile_name:
        description: "human-readable build profile (for jobs and evidence)"
        type: string
        required: true
      artifact_prefix:
        description: "unique lowercase prefix for this profile's artifacts"
        type: string
        required: true
      job_name_prefix:
        description: "caller job name used to build direct matrix-job links"
        type: string
        required: false
        default: ""
      wait_sec:
        description: "per-attempt generation timeout"
        type: number
        required: false
        default: 300
      templates_ref:
        description: "bartonsun/D2-Templates git ref"
        type: string
        required: false
        default: master
      template_origin:
        description: "template source: upstream or bundled"
        type: string
        required: false
        default: upstream
      mesa_asset_url:
        description: "exact pal1000 Mesa release-msvc.7z URL shared by both profiles"
        type: string
        required: true
      mesa_asset_digest:
        description: "GitHub release asset digest (sha256:...) shared by both profiles"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      dll_run_id:
        description: "test-harness run id for the harness DLL (empty = latest run with the artifact)"
        type: string
        required: false
        default: ""
      dll_artifact:
        description: "harness DLL artifact to execute"
        type: string
        required: false
        default: mss32-test-harness-debug
      profile_name:
        description: "human-readable build profile"
        type: string
        required: false
        default: DebugTest
      artifact_prefix:
        description: "unique lowercase prefix for evidence artifacts"
        type: string
        required: false
        default: debug
      job_name_prefix:
        description: "caller job name prefix (empty for direct dispatch)"
        type: string
        required: false
        default: ""
      wait_sec:
        description: "seconds to wait for each generation attempt"
        type: number
        required: false
        default: 300
      templates_ref:
        description: "bartonsun/D2-Templates git ref"
        type: string
        required: false
        default: master
      template_origin:
        description: "template source"
        type: choice
        options:
          - upstream
          - bundled
        required: false
        default: upstream
      mesa_asset_url:
        description: "exact Mesa release-msvc.7z URL (empty = resolve latest)"
        type: string
        required: false
        default: ""
      mesa_asset_digest:
        description: "matching GitHub asset digest (empty with URL = resolve latest pair)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read # list harness runs/jobs + download the requested DLL artifact

env:
  GAME_FIXTURE_XET_HASH: 6842c7d20be847eeb8aacb48d0cb89a05052f8a5b4811fe3feead2388935c0fe
  GAME_FIXTURE_BYTES: "1948898431"
  GAME_CACHE_KEY: slasher-min-xet-6842c7d20be847eeb8aacb48d0cb89a05052f8a5b4811fe3feead2388935c0fe

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.dll.outputs.run_id }}
      matrix: ${{ steps.parse.outputs.matrix }}
      template_digest: ${{ steps.parse.outputs.template_digest }}
      template_count: ${{ steps.parse.outputs.template_count }}
      template_origin: ${{ steps.parse.outputs.template_origin }}
      source_revision: ${{ steps.parse.outputs.source_revision }}
      source_description: ${{ steps.parse.outputs.source_description }}
      mesa_url: ${{ steps.mesa.outputs.url }}
      mesa_digest: ${{ steps.mesa.outputs.digest }}
    steps:
      # Sparse, no submodules: this root job only needs the parser, not the whole repo.
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          sparse-checkout: tools/test
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout authoritative template source
        if: ${{ inputs.template_origin == 'upstream' }}
        uses: actions/checkout@v6
        with:
          repository: bartonsun/D2-Templates
          ref: ${{ inputs.templates_ref }}
          path: template-repo
          fetch-depth: 1
          persist-credentials: false
      - name: Restore the pinned game fixture for bundled templates
        if: ${{ inputs.template_origin == 'bundled' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            game.tar.gz
            game.sha256
            game.xet
          key: ${{ env.GAME_CACHE_KEY }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Resolve one immutable Mesa asset for every template job
        id: mesa
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN_URL: ${{ inputs.mesa_asset_url }}
          GIVEN_DIGEST: ${{ inputs.mesa_asset_digest }}
        shell: bash
        run: |
          set -euo pipefail
          url="$GIVEN_URL"
          digest="$GIVEN_DIGEST"
          if [ -z "$url" ] && [ -z "$digest" ]; then
            asset=$(gh api repos/pal1000/mesa-dist-win/releases/latest \
              --jq '[.assets[] | select(.name | test("release-msvc\\.7z$"))][0] | [.browser_download_url, .digest] | @tsv')
            IFS=$'\t' read -r url digest <<< "$asset"
          elif [ -z "$url" ] || [ -z "$digest" ]; then
            echo "::error::mesa_asset_url and mesa_asset_digest must be supplied together"
            exit 1
          fi
          [[ "$url" =~ ^https://github[.]com/pal1000/mesa-dist-win/releases/download/.+/[^/]*release-msvc\.7z$ ]] || {
            echo "::error::unexpected Mesa asset URL"
            exit 1
          }
          [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
            echo "::error::unexpected Mesa asset digest"
            exit 1
          }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "digest=${digest,,}" >> "$GITHUB_OUTPUT"
      - name: Resolve the test-harness DLL run
        id: dll
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          GIVEN: ${{ inputs.dll_run_id }}
          DLL_ARTIFACT: ${{ inputs.dll_artifact }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DLL_ARTIFACT" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid DLL artifact name"; exit 1; }
          [[ "$ARTIFACT_PREFIX" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::artifact_prefix must be lowercase letters, digits and hyphens"; exit 1; }
          rid="$GIVEN"
          if [ -z "$rid" ]; then
            for id in $(gh run list --workflow test-harness.yml --branch "$BRANCH" --status completed \
                          -L 20 --json databaseId --jq '.[].databaseId' -R "$REPO"); do
              if gh api --paginate "repos/$REPO/actions/runs/$id/artifacts?per_page=100" \
                    --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null | grep -Fxq "$DLL_ARTIFACT"; then
                rid="$id"; break
              fi
            done
          fi
          [ -n "$rid" ] || { echo "::error::no test-harness build with a live $DLL_ARTIFACT artifact on '$BRANCH'"; exit 1; }
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo "::error::dll_run_id must be a numeric Actions run id"; exit 1; }
          artifact_id=$(gh api --paginate "repos/$REPO/actions/runs/$rid/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.name, .id] | @tsv' | \
            awk -F '\t' -v name="$DLL_ARTIFACT" '$1 == name { print $2; exit }')
          [ -n "$artifact_id" ] || {
            echo "::error::run $rid has no live $DLL_ARTIFACT artifact"
            exit 1
          }
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"
      - name: Parse template list -> matrix
        id: parse
        env:
          TEMPLATES_REF: ${{ inputs.templates_ref }}
          TEMPLATE_ORIGIN: ${{ inputs.template_origin }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TEMPLATE_ORIGIN" in
            upstream|bundled) ;;
            *) echo "::error::template_origin must be upstream or bundled"; exit 1 ;;
          esac
          mkdir -p template-snapshot/Templates
          : > template-snapshot/template-manifest.tsv
          if [ "$TEMPLATE_ORIGIN" = upstream ]; then
            source_root=template-repo/sMNS
            source_revision=$(git -C template-repo rev-parse HEAD)
            if [[ "$TEMPLATES_REF" =~ ^[0-9a-fA-F]{40}$ && "${source_revision,,}" != "${TEMPLATES_REF,,}" ]]; then
              echo "::error::template checkout resolved to $source_revision, expected $TEMPLATES_REF"
              exit 1
            fi
            source_description="bartonsun/D2-Templates@$source_revision"
          else
            actual_xet=$(tr -d '\r\n ' < game.xet)
            [ "$actual_xet" = "$GAME_FIXTURE_XET_HASH" ] || { echo "::error::wrong game Xet identity"; exit 1; }
            actual_bytes=$(stat -c '%s' game.tar.gz)
            [ "$actual_bytes" = "$GAME_FIXTURE_BYTES" ] || { echo "::error::wrong game archive size"; exit 1; }
            expected_sha=$(awk 'NR == 1 { print tolower($1) }' game.sha256)
            [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid cached game SHA-256"; exit 1; }
            actual_sha=$(sha256sum game.tar.gz | cut -d' ' -f1)
            [ "$actual_sha" = "$expected_sha" ] || { echo "::error::wrong game archive SHA-256"; exit 1; }
            mkdir -p bundled-game
            tar -xzf game.tar.gz -C bundled-game --wildcards '*/Templates/*.lua'
            mapfile -d '' template_dirs < <(find bundled-game -type d -name Templates -print0)
            [ "${#template_dirs[@]}" -eq 1 ] || {
              echo "::error::expected exactly one bundled Templates directory, found ${#template_dirs[@]}"
              exit 1
            }
            source_root=${template_dirs[0]}
            source_revision=$actual_sha
            source_description="pinned-game-fixture-xet:$actual_xet"
          fi
          if [ "$TEMPLATE_ORIGIN" = upstream ]; then
            mapfile -d '' source_files < <(find "$source_root" -type f -name '*.lua' -print0 | sort -z)
          else
            mapfile -d '' source_files < <(find "$source_root" -maxdepth 1 -type f -name '*.lua' -print0 | sort -z)
            [ "${#source_files[@]}" -eq 20 ] || {
              echo "::error::pinned game fixture must contain exactly 20 root Templates/*.lua files, found ${#source_files[@]}"
              exit 1
            }
          fi
          declare -A seen
          for src in "${source_files[@]}"; do
            base=$(basename "$src")
            if [[ "$base" == *$'\t'* || "$base" == *$'\r'* || "$base" == *$'\n'* ]]; then
              echo "::error::template filename contains a TSV/control-line delimiter"
              exit 1
            fi
            key=${base,,}
            if [[ -n "${seen[$key]:-}" ]]; then
              echo "::error::case-insensitive template basename collision: ${seen[$key]} and $src"
              exit 1
            fi
            seen[$key]="$src"
            cp "$src" "template-snapshot/Templates/$base"
            hash=$(sha256sum "$src" | cut -d' ' -f1)
            bytes=$(stat -c '%s' "$src")
            if [ "$TEMPLATE_ORIGIN" = upstream ]; then
              relative=${src#${source_root}/}
            else
              relative="game://Templates/$base"
            fi
            if [[ "$relative" == *$'\t'* || "$relative" == *$'\r'* || "$relative" == *$'\n'* ]]; then
              echo "::error::template source path contains a TSV/control-line delimiter"
              exit 1
            fi
            printf '%s\t%s\t%s\t%s\n' "$hash" "$bytes" "$base" "$relative" >> template-snapshot/template-manifest.tsv
          done
          template_count=$(wc -l < template-snapshot/template-manifest.tsv | tr -d ' ')
          template_digest=$(sha256sum template-snapshot/template-manifest.tsv | cut -d' ' -f1)
          [ "$template_count" -gt 0 ] || { echo "::error::template snapshot is empty"; exit 1; }
          echo "template_count=$template_count" >> "$GITHUB_OUTPUT"
          echo "template_digest=$template_digest" >> "$GITHUB_OUTPUT"
          echo "template_origin=$TEMPLATE_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "source_description=$source_description" >> "$GITHUB_OUTPUT"
          printf 'origin=%s\nrevision=%s\ndescription=%s\nmanifest-sha256=%s\ncount=%s\n' \
            "$TEMPLATE_ORIGIN" "$source_revision" "$source_description" "$template_digest" "$template_count" \
            > template-snapshot/source-metadata.txt
          echo "template snapshot: origin=$TEMPLATE_ORIGIN source=$source_description count=$template_count manifest-sha256=$template_digest"
          npm install luaparse@0.3.1 --no-save --ignore-scripts --silent
          node tools/test/list-templates.js template-snapshot/Templates --strict > matrix.json
          parsed_count=$(jq 'length' matrix.json)
          [ "$parsed_count" -eq "$template_count" ] || {
            echo "::error::strict parser returned $parsed_count entries for $template_count .lua files"
            exit 1
          }
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Upload the exact template snapshot + manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-template-source-snapshot
          path: template-snapshot/
          retention-days: 90
          if-no-files-found: error

  generate:
    name: '#${{ matrix.template.index }} ${{ matrix.template.name }}'
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: windows-2025-vs2026
    env:
      GALLIUM_DRIVER: llvmpipe
      REC_DIR: ${{ github.workspace }}/recording
      PROFILE_NAME: ${{ inputs.profile_name }}
      ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
      TEMPLATE_ORIGIN: ${{ needs.setup.outputs.template_origin }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          sparse-checkout: tools
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Get the ${{ inputs.profile_name }} harness DLL
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.dll_artifact }}
          path: dll
          run-id: ${{ needs.setup.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Get the exact template snapshot parsed by setup
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-template-source-snapshot
          path: template-source
      - name: Prepare immutable evidence metadata
        env:
          TEMPLATE_INDEX: ${{ matrix.template.index }}
          TEMPLATE_NAME: ${{ matrix.template.name }}
          SOURCE_REVISION: ${{ needs.setup.outputs.source_revision }}
          SOURCE_DESCRIPTION: ${{ needs.setup.outputs.source_description }}
          TEMPLATE_DIGEST: ${{ needs.setup.outputs.template_digest }}
          DLL_ARTIFACT: ${{ inputs.dll_artifact }}
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          @(
            "profile=$env:PROFILE_NAME"
            "artifact-prefix=$env:ARTIFACT_PREFIX"
            "dll-artifact=$env:DLL_ARTIFACT"
            "dll-sha256=$((Get-FileHash -LiteralPath 'dll/mss32.dll' -Algorithm SHA256).Hash.ToLowerInvariant())"
            "template-index=$env:TEMPLATE_INDEX"
            "template-name=$env:TEMPLATE_NAME"
            "template-origin=$env:TEMPLATE_ORIGIN"
            "template-source=$env:SOURCE_DESCRIPTION"
            "template-source-revision=$env:SOURCE_REVISION"
            "template-manifest-sha256=$env:TEMPLATE_DIGEST"
            "attempts=5"
            "runner-image=$env:ImageOS-$env:ImageVersion"
          ) | Set-Content evidence/metadata.txt -Encoding utf8
          Copy-Item template-source/template-manifest.tsv evidence/template-manifest.tsv -Force
          Copy-Item template-source/source-metadata.txt evidence/source-metadata.txt -Force
      - name: Enable DirectPlay (TCP/IP protocol for the multiplayer setup path)
        run: |
          try {
            if ((Get-WindowsOptionalFeature -Online -FeatureName DirectPlay).State -ne 'Enabled') {
              Enable-WindowsOptionalFeature -Online -FeatureName DirectPlay -All -NoRestart -ErrorAction Stop | Out-Null
            }
          } catch { Write-Host "::warning::Enable DirectPlay failed: $($_.Exception.Message)" }
      - name: Restore game from cache
        uses: actions/cache/restore@v5
        with:
          path: |
            game.tar.gz
            game.sha256
            game.xet
          key: ${{ env.GAME_CACHE_KEY }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unpack game + deploy DLL + force OpenGL/ColdCPU
        run: |
          if ((Get-Content game.xet -Raw).Trim() -ne $env:GAME_FIXTURE_XET_HASH) { throw 'wrong game Xet identity' }
          if ((Get-Item game.tar.gz).Length -ne [int64]$env:GAME_FIXTURE_BYTES) { throw 'wrong game archive size' }
          $expectedSha = ((Get-Content game.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($expectedSha -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash game.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedSha) { throw 'wrong game archive SHA-256' }
          New-Item -ItemType Directory -Force -Path game | Out-Null
          tar -xzf game.tar.gz -C game
          $dir = (Get-ChildItem game -Directory | Select-Object -First 1).FullName
          Copy-Item dll\mss32.dll "$dir\mss32.dll" -Force
          $templates = Join-Path $dir 'Templates'
          if ($env:TEMPLATE_ORIGIN -eq 'upstream') {
            Remove-Item -LiteralPath $templates -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item -LiteralPath 'template-source\Templates' -Destination $templates -Recurse -Force
          } elseif ($env:TEMPLATE_ORIGIN -ne 'bundled') {
            throw "unexpected template origin: $env:TEMPLATE_ORIGIN"
          }
          $manifestNames = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($line in Get-Content 'template-source\template-manifest.tsv') {
            $parts = @($line -split "`t", 4)
            if ($parts.Count -ne 4 -or $parts[0] -notmatch '^[0-9a-fA-F]{64}$') { throw "invalid template manifest row: $line" }
            $expectedHash, $expectedBytes, $flatName, $sourcePath = $parts
            if (-not $manifestNames.Add($flatName)) { throw "duplicate template manifest name: $flatName" }
            $sourceFile = Join-Path 'template-source\Templates' $flatName
            $deployedFile = Join-Path $templates $flatName
            if ((Get-Item -LiteralPath $sourceFile).Length -ne [int64]$expectedBytes) { throw "template snapshot size mismatch: $sourcePath" }
            if ((Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256).Hash -ne $expectedHash) { throw "template snapshot hash mismatch: $sourcePath" }
            if ((Get-FileHash -LiteralPath $deployedFile -Algorithm SHA256).Hash -ne $expectedHash) { throw "deployed template hash mismatch: $flatName" }
          }
          $deployedLua = @(Get-ChildItem -LiteralPath $templates -Filter '*.lua' -File)
          if ($deployedLua.Count -ne $manifestNames.Count) {
            throw "deployed template count mismatch: expected $($manifestNames.Count), got $($deployedLua.Count)"
          }
          foreach ($file in $deployedLua) {
            if (-not $manifestNames.Contains($file.Name)) { throw "unexpected deployed template: $($file.Name)" }
          }
          $ini = Join-Path $dir 'Disciple.ini'
          if (Test-Path $ini) {
            $c = Get-Content $ini -Raw
            if ($c -match '(?m)^Renderer=')      { $c = $c -replace '(?m)^Renderer=\d+','Renderer=3' }
            elseif ($c -match '(?m)^\[Wrapper\]') { $c = $c -replace '(?m)^\[Wrapper\]',"[Wrapper]`r`nRenderer=3" }
            else                                  { $c += "`r`n[Wrapper]`r`nRenderer=3`r`n" }
            if ($c -match '(?m)^ColdCPU=')       { $c = $c -replace '(?m)^ColdCPU=\d+','ColdCPU=0' }
            elseif ($c -match '(?m)^\[Wrapper\]') { $c = $c -replace '(?m)^\[Wrapper\]',"[Wrapper]`r`nColdCPU=0" }
            Set-Content -Path $ini -Value $c -Encoding ASCII -NoNewline
          }
          "GAME_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Deploy Mesa3D software OpenGL (llvmpipe)
        env:
          MESA_ASSET_URL: ${{ needs.setup.outputs.mesa_url }}
          MESA_ASSET_DIGEST: ${{ needs.setup.outputs.mesa_digest }}
        run: |
          $dir = $env:GAME_DIR
          $url = $env:MESA_ASSET_URL
          $expectedDigest = $env:MESA_ASSET_DIGEST
          if ($url -notmatch '^https://github\.com/pal1000/mesa-dist-win/releases/download/.+/[^/]*release-msvc\.7z$') {
            throw "unexpected Mesa asset URL: $url"
          }
          if ($expectedDigest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw "unexpected Mesa asset digest: $expectedDigest"
          }
          $z = Join-Path $env:TEMP 'mesa.7z'
          Invoke-WebRequest $url -OutFile $z -UseBasicParsing
          $actualDigest = 'sha256:' + (Get-FileHash -LiteralPath $z -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest.ToLowerInvariant()) {
            throw "Mesa digest mismatch: expected $expectedDigest, got $actualDigest"
          }
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          @(
            "url=$url"
            "digest=$actualDigest"
          ) | Set-Content evidence/mesa.txt -Encoding utf8
          $ex = Join-Path $env:TEMP 'mesa'
          $sevenzip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenzip) { $sevenzip = 'C:\Program Files\7-Zip\7z.exe' }
          & $sevenzip x $z "-o$ex" -y "x86" | Out-Null
          Copy-Item "$ex\x86\*.dll" $dir -Force -ErrorAction SilentlyContinue
      - name: Install OBS Studio (portable) for required template video
        run: |
          . ./tools/test/_obs.ps1
          Install-Obs
      - name: Generate template ${{ matrix.template.index }} (${{ matrix.template.name }}) five times; load attempt 5 [recorded]
        id: attempts
        env:
          T_INDEX: ${{ matrix.template.index }}
          T_NAME: ${{ matrix.template.name }}
          WAIT_SEC: ${{ inputs.wait_sec }}
        run: |
          node --version
          $waitSec = [int]$env:WAIT_SEC
          if ($waitSec -lt 1 -or $waitSec -gt 600) { throw "wait_sec must be 1..600" }
          # Every loop launches and drives the actual game client with its natural runtime randomness.
          # Attempts 1-4 stop after successful generation; attempt 5 also accepts and loads the map,
          # dismisses the startup dialogs, and waits for a populated actionable strategic state. A child
          # pwsh keeps one failed attempt from preventing the remaining four from producing evidence.
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path $env:REC_DIR | Out-Null
          . ./tools/test/_obs.ps1
          New-Item -ItemType Directory -Force outcome | Out-Null
          $outcomeFile = "outcome/$($env:T_INDEX).tsv"
          Remove-Item -LiteralPath $outcomeFile -Force -ErrorAction SilentlyContinue
          $results = [Collections.Generic.List[object]]::new()

          foreach ($attempt in 1..5) {
            $phase = if ($attempt -eq 5) { 'generation+map' } else { 'generation-only' }
            $expectedStatus = if ($attempt -eq 5) { 'reached map' } else { 'generated' }
            $attemptStarted = Get-Date
            $attemptRecDir = Join-Path $env:REC_DIR "attempt-$attempt"
            $attemptEvidence = Join-Path 'evidence' "attempt-$attempt"
            New-Item -ItemType Directory -Force -Path $attemptRecDir, $attemptEvidence | Out-Null
            Write-Host "`n===== $($env:PROFILE_NAME) / $($env:T_NAME) / attempt $attempt of 5 / $phase =====" -ForegroundColor Cyan

            $recordingError = $null
            $videoPath = $null
            try {
              # Five FPS is enough to prove the dialog/error sequence without making five recordings huge.
              # Start when the host reports its first rendered dialog. This removes the long black
              # boot prefix while still beginning well before the generator form is opened.
              Start-ObsRecording -OutDir $attemptRecDir -HostOnly -ReadyTimeoutSec 30 -Fps 5 -BitrateKbps 1200 | Out-Null
            } catch {
              $recordingError = "OBS start failed: $($_.Exception.Message)"
              Write-Host "::error::$recordingError"
            }

            # Capture every stream so GEN_OUTCOME and GEN_SECONDS remain available in a standalone
            # per-attempt console log as well as the raw job log.
            $out = [Collections.Generic.List[object]]::new()
            $code = 1
            try {
              $scenarioArgs = @(
                '-NoLogo', '-NoProfile', '-NonInteractive',
                '-File', './tools/test/scenario-generation.ps1', '-GameDir', $env:GAME_DIR,
                '-Template', $env:T_INDEX, '-WaitGenerationSec', $waitSec, '-UseTemplateDefaults',
                '-RecorderReadyFile', (Join-Path $attemptRecDir 'obs-recording-ready.json')
              )
              if ($attempt -eq 5) { $scenarioArgs += '-ToMap' }
              # Stream the child output while retaining it for the TSV/evidence parser. Previously it
              # was buffered until after OBS stopped, which made GitHub timestamps misleading.
              & "$PSHOME\pwsh.exe" @scenarioArgs 2>&1 | ForEach-Object {
                [void]$out.Add($_)
                Write-Host $_
              }
              $code = $LASTEXITCODE
            } catch {
              [void]$out.Add("attempt wrapper exception: $($_.Exception.Message)")
              $code = 1
            } finally {
              try {
                $mkv = Stop-ObsRecording
                if ($mkv) {
                  $videoPath = Join-Path $attemptRecDir "$($env:ARTIFACT_PREFIX)-template-$($env:T_INDEX)-attempt-$attempt.mkv"
                  Move-Item -LiteralPath $mkv -Destination $videoPath -Force
                }
              } catch {
                $stopError = "OBS stop failed: $($_.Exception.Message)"
                $recordingError = if ($recordingError) { "$recordingError; $stopError" } else { $stopError }
                Write-Host "::error::$stopError"
              }
            }

            $out | ForEach-Object { [string]$_ } | Set-Content (Join-Path $attemptEvidence 'console.log') -Encoding utf8
            $oc = $out | Select-String '^GEN_OUTCOME=' | Select-Object -Last 1
            $status = if ($oc) { ($oc.Line -replace '^GEN_OUTCOME=', '') } else { "failed (exit $code, no outcome line)" }
            $status = (($status -replace '[\r\n\t]+', ' ').Trim())
            $sc = $out | Select-String '^GEN_SECONDS=' | Select-Object -Last 1
            $secs = if ($sc) { (($sc.Line -replace '^GEN_SECONDS=', '') -replace '[^0-9]', '') } else { '' }
            $green = $oc -and $status -eq $expectedStatus -and $code -eq 0
            $consistent = $oc -and (($status -eq $expectedStatus -and $code -eq 0) -or ($status -ne $expectedStatus -and $code -ne 0))
            if (-not $consistent) {
              $reported = $status
              $status = "harness failure: inconsistent outcome '$reported' (child exit $code)"
              $green = $false
            }

            # index<TAB>name<TAB>attempt<TAB>phase<TAB>outcome<TAB>generation-seconds
            ("{0}`t{1}`t{2}`t{3}`t{4}`t{5}`n" -f $env:T_INDEX, $env:T_NAME, $attempt, $phase, $status, $secs) |
              Add-Content -LiteralPath $outcomeFile -Encoding utf8 -NoNewline
            @(
              "attempt=$attempt"
              "phase=$phase"
              "child-exit=$code"
              "scenario-passed=$($green.ToString().ToLowerInvariant())"
              "scenario-outcome=$status"
              "generation-seconds=$secs"
              "video=$videoPath"
              "recording-error=$recordingError"
            ) | Set-Content (Join-Path $attemptEvidence 'result.txt') -Encoding utf8
            foreach ($name in @('obs.log', 'obs-owned.json', 'obs-recording-ready.json')) {
              $file = Join-Path $attemptRecDir $name
              if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file -Destination $attemptEvidence -Force }
            }
            Get-ChildItem -LiteralPath $env:GAME_DIR -Filter 'mss32_*.log' -File -ErrorAction SilentlyContinue |
              Where-Object LastWriteTime -GE $attemptStarted.AddSeconds(-2) |
              Copy-Item -Destination $attemptEvidence -Force
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'relay-*.out.log*' -File -ErrorAction SilentlyContinue |
              Where-Object LastWriteTime -GE $attemptStarted.AddSeconds(-2) |
              Copy-Item -Destination $attemptEvidence -Force

            $results.Add([pscustomobject]@{
              Attempt = $attempt; Phase = $phase; Status = $status; Seconds = $secs
              Green = [bool]$green; VideoPath = $videoPath
            })
            Write-Host "::notice title=$($env:T_NAME) attempt $attempt/5::$status ($phase)"
          }

          # Retention policy: five green attempts keep only attempt 5. If anything failed, keep every
          # failed attempt and remove all successful-attempt recordings (including attempt 5).
          $failedAttempts = @($results | Where-Object { -not $_.Green })
          "has_failures=$(([bool]($failedAttempts.Count -gt 0)).ToString().ToLowerInvariant())" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $keepAttempts = if ($failedAttempts.Count -eq 0) { @(5) } else { @($failedAttempts.Attempt) }
          foreach ($result in $results) {
            $keep = $result.Attempt -in $keepAttempts
            "keep_$($result.Attempt)=$($keep.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            if (-not $keep -and $result.VideoPath -and (Test-Path -LiteralPath $result.VideoPath)) {
              Remove-Item -LiteralPath $result.VideoPath -Force
            }
          }
          $missingVideos = @($results | Where-Object {
            $_.Attempt -in $keepAttempts -and (-not $_.VideoPath -or -not (Test-Path -LiteralPath $_.VideoPath))
          })
          foreach ($missing in $missingVideos) {
            $scenarioStatus = $missing.Status
            $missing.Status = "harness failure: required retained video missing (scenario outcome: $scenarioStatus)"
            $missing.Green = $false
            Add-Content -LiteralPath (Join-Path 'evidence' "attempt-$($missing.Attempt)\result.txt") `
              -Value "evidence-error=required retained video missing" -Encoding utf8
          }
          # The aggregate summaries consume this file, so rewrite its five rows after evidence
          # validation. This prevents a missing mandatory proof video from being reported as 5/5 green.
          $results | ForEach-Object {
            "{0}`t{1}`t{2}`t{3}`t{4}`t{5}" -f $env:T_INDEX, $env:T_NAME, $_.Attempt, $_.Phase, $_.Status, $_.Seconds
          } | Set-Content -LiteralPath $outcomeFile -Encoding utf8
          foreach ($result in $results) {
            @(
              "final-passed=$($result.Green.ToString().ToLowerInvariant())"
              "final-outcome=$($result.Status)"
            ) | Add-Content -LiteralPath (Join-Path 'evidence' "attempt-$($result.Attempt)\result.txt") -Encoding utf8
          }
          $finalFailures = @($results | Where-Object { -not $_.Green })
          if ($missingVideos.Count -gt 0) {
            Write-Error "required retained video missing for attempt(s): $($missingVideos.Attempt -join ', ')"
          }
          if ($failedAttempts.Count -gt 0) {
            Write-Error "template failed under $($env:PROFILE_NAME) in attempt(s): $($failedAttempts.Attempt -join ', ')"
          }
          if ($finalFailures.Count -gt 0) { exit 1 }
          exit 0

      - name: Upload retained attempt 1 video (raw MKV)
        id: video_1
        if: always() && steps.attempts.outputs.keep_1 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-1-video
          path: ${{ env.REC_DIR }}/attempt-1/${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-1.mkv
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload retained attempt 2 video (raw MKV)
        id: video_2
        if: always() && steps.attempts.outputs.keep_2 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-2-video
          path: ${{ env.REC_DIR }}/attempt-2/${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-2.mkv
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload retained attempt 3 video (raw MKV)
        id: video_3
        if: always() && steps.attempts.outputs.keep_3 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-3-video
          path: ${{ env.REC_DIR }}/attempt-3/${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-3.mkv
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload retained attempt 4 video (raw MKV)
        id: video_4
        if: always() && steps.attempts.outputs.keep_4 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-4-video
          path: ${{ env.REC_DIR }}/attempt-4/${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-4.mkv
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload retained attempt 5 video (raw MKV)
        id: video_5
        if: always() && steps.attempts.outputs.keep_5 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-5-video
          path: ${{ env.REC_DIR }}/attempt-5/${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-attempt-5.mkv
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload this template's outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-gen-outcome-${{ matrix.template.index }}
          path: outcome/*.tsv
          retention-days: 90
          if-no-files-found: error
      - name: Collect this template's diagnostics
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          if (Test-Path -LiteralPath outcome) {
            Copy-Item -LiteralPath outcome -Destination evidence -Recurse -Force
          }
          foreach ($name in @('obs.log', 'obs-owned.json', 'obs-recording-ready.json')) {
            $file = Join-Path $env:REC_DIR $name
            if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file -Destination evidence -Force }
          }
          if ($env:GAME_DIR -and (Test-Path -LiteralPath $env:GAME_DIR)) {
            Get-ChildItem -LiteralPath $env:GAME_DIR -Filter 'mss32_*.log' -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination evidence -Force
          }
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'relay-*.out.log*' -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination evidence -Force
      - name: Upload this template's diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-template-${{ matrix.template.index }}-evidence
          path: evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Link failed-attempt template videos in the job summary
        # A 5/5-green run still retains attempt 5 as reserve evidence, but does not advertise that
        # video in the summary. Failed jobs link only the failed-attempt recordings retained above.
        if: always() && steps.attempts.outputs.has_failures == 'true'
        env:
          VIDEO_1: ${{ steps.video_1.outputs.artifact-url }}
          VIDEO_2: ${{ steps.video_2.outputs.artifact-url }}
          VIDEO_3: ${{ steps.video_3.outputs.artifact-url }}
          VIDEO_4: ${{ steps.video_4.outputs.artifact-url }}
          VIDEO_5: ${{ steps.video_5.outputs.artifact-url }}
        run: |
          $links = [Collections.Generic.List[string]]::new()
          foreach ($attempt in 1..5) {
            $url = [Environment]::GetEnvironmentVariable("VIDEO_$attempt")
            if ($url) { $links.Add("- [attempt $attempt recording]($url)") }
          }
          if ($links.Count -gt 0) {
            "### $($env:PROFILE_NAME) failed-attempt recordings" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $links | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

  # Aggregate every template's outcome into one table in the run summary.
  summarize:
    name: Summary
    needs: [setup, generate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect per-template outcomes
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact_prefix }}-gen-outcome-*
          path: outcomes
          merge-multiple: true
      - name: Build the results table
        shell: bash
        env:
          EXPECTED_MATRIX: ${{ needs.setup.outputs.matrix }}
          TEMPLATE_DIGEST: ${{ needs.setup.outputs.template_digest }}
          TEMPLATE_COUNT: ${{ needs.setup.outputs.template_count }}
          TEMPLATE_ORIGIN: ${{ needs.setup.outputs.template_origin }}
          SOURCE_REVISION: ${{ needs.setup.outputs.source_revision }}
          SOURCE_DESCRIPTION: ${{ needs.setup.outputs.source_description }}
          PROFILE_NAME: ${{ inputs.profile_name }}
          JOB_NAME_PREFIX: ${{ inputs.job_name_prefix }}
          MESA_ASSET_URL: ${{ needs.setup.outputs.mesa_url }}
          MESA_ASSET_DIGEST: ${{ needs.setup.outputs.mesa_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jobs_file="$RUNNER_TEMP/template-run-jobs.jsonl"
          : > "$jobs_file"
          page=1
          while :; do
            page_file="$RUNNER_TEMP/template-run-jobs-page-${page}.json"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100&page=${page}" \
              > "$page_file"
            page_count=$(jq '.jobs | length' "$page_file")
            jq -c '.jobs[] | {name, html_url}' "$page_file" >> "$jobs_file"
            [ "$page_count" -eq 100 ] || break
            page=$((page + 1))
          done

          template_job_link() {
            local idx="$1" name="$2" expected url
            if [ -n "$JOB_NAME_PREFIX" ]; then
              expected="${JOB_NAME_PREFIX} / #${idx} ${name}"
            else
              expected="#${idx} ${name}"
            fi
            url=$(jq -r -s --arg wanted "$expected" \
              '[.[] | select(.name == $wanted)] | if length == 1 then .[0].html_url else empty end' \
              "$jobs_file")
            if [ -z "$url" ]; then
              echo "::warning title=Template job link unavailable::Could not resolve exact job: ${expected}" >&2
              url="$run_url"
            fi
            printf '%s' "$url"
          }

          {
            echo "## ${PROFILE_NAME}: five random-scenario attempts per template"
            echo ""
            echo "> Run: [#${GITHUB_RUN_NUMBER}](${run_url}). Each \`job\` link below opens the exact template matrix job."
            echo "> Strict ${PROFILE_NAME} gate: attempts 1-4 must generate; attempt 5 must also load a populated, actionable strategic map after the startup dialogs."
            echo "> Natural game randomness is preserved. All five outcomes/log sets are retained. If all pass, only attempt 5 video is retained; otherwise only failed-attempt videos are retained."
            if [ "$TEMPLATE_ORIGIN" = upstream ]; then
              echo "> Source: [${SOURCE_DESCRIPTION}](https://github.com/bartonsun/D2-Templates/commit/${SOURCE_REVISION}); ${TEMPLATE_COUNT} files; manifest SHA-256 \`${TEMPLATE_DIGEST}\`."
            else
              echo "> Source: templates shipped in ${SOURCE_DESCRIPTION}; archive SHA-256 \`${SOURCE_REVISION}\`; ${TEMPLATE_COUNT} files; manifest SHA-256 \`${TEMPLATE_DIGEST}\`."
            fi
            echo "> Mesa runtime asset: \`${MESA_ASSET_URL}\`; verified \`${MESA_ASSET_DIGEST}\`."
            echo ""
            echo "| | # | Template | Attempt | Scope | Time | Outcome |"
            echo "|:--:|--:|---|--:|---|--:|---|"
            while IFS=$'\t' read -r idx name; do
              job_url=$(template_job_link "$idx" "$name")
              plain_name=$(printf '%s' "$name" | tr '|' '/')
              display_name="[job](${job_url}) ${plain_name}"
              row="outcomes/$idx.tsv"
              if [ ! -f "$row" ]; then
                echo "| ❌ | $idx | $display_name | - | - | - | infrastructure failure: no outcome artifact |"
                failed=1
                continue
              fi
              line_count=$(awk 'END { print NR + 0 }' "$row")
              if [ "$line_count" -ne 5 ]; then
                echo "| ❌ | $idx | $display_name | - | - | - | infrastructure failure: expected 5 rows, found $line_count |"
                failed=1
                continue
              fi
              for attempt in 1 2 3 4 5; do
                match_count=$(awk -F '\t' -v wanted="$attempt" '$3 == wanted { n++ } END { print n + 0 }' "$row")
                if [ "$match_count" -ne 1 ]; then
                  echo "| ❌ | $idx | $display_name | $attempt | - | - | infrastructure failure: expected one attempt row, found $match_count |"
                  failed=1
                  continue
                fi
                line=$(awk -F '\t' -v wanted="$attempt" '$3 == wanted { print; exit }' "$row")
                IFS=$'\t' read -r actual_idx actual_name actual_attempt phase status secs <<< "$line"
                secs=${secs%$'\r'}
                expected_phase=$(if [ "$attempt" -eq 5 ]; then echo 'generation+map'; else echo 'generation-only'; fi)
                expected_status=$(if [ "$attempt" -eq 5 ]; then echo 'reached map'; else echo 'generated'; fi)
                if [ "$actual_idx" != "$idx" ] || [ "$actual_name" != "$name" ] || [ "$actual_attempt" != "$attempt" ] || [ "$phase" != "$expected_phase" ]; then
                  status="infrastructure failure: outcome identity/scope mismatch"
                  failed=1
                fi
                mode="${status%% | *}"
                if [ "$mode" = "$expected_status" ]; then
                  icon='✅'
                elif [[ "$mode" == "no result"* ]]; then
                  icon='⏳'; failed=1
                else
                  icon='❌'; failed=1
                fi
                if [ -z "$secs" ]; then t='-'; elif [ "$secs" -gt 99 ] 2>/dev/null; then t='99+s'; else t="${secs}s"; fi
                detail=$(printf '%s' "$status" | tr '|' '/')
                echo "| $icon | $idx | $display_name | $attempt | $expected_phase | $t | ${detail:0:150} |"
              done
            done < <(printf '%s' "$EXPECTED_MATRIX" | jq -r '.[] | [.index,.name] | @tsv')
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ] || exit 1
