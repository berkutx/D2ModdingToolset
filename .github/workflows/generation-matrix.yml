name: generation-matrix

# Generate and load every random-scenario template, one job per template, and report which reaches
# the strategic map vs errors (the harness distinguishes a sol3 panic, a mid-generation error box,
# a timeout, and a generated scenario that cannot be started). The matrix axis is parsed from the
# game's Templates/*.lua by tools/test/list-templates.js.

on:
  workflow_call:
    inputs:
      dll_run_id:
        description: "test-harness run id containing mss32-test-harness-debug"
        # github.run_id is a string expression. Validate its numeric shape in setup instead of making
        # reusable-workflow dispatch fail before the setup job can report a useful error.
        type: string
        required: true
      wait_sec:
        description: "per-template generation timeout"
        type: number
        required: false
        default: 300
  workflow_dispatch:
    inputs:
      dll_run_id:
        description: "test-harness run id for the debug harness DLL (empty = latest successful build)"
        type: string
        required: false
        default: ""
      wait_sec:
        description: "seconds to wait for each template's generation"
        type: number
        required: false
        default: 300

permissions:
  contents: read
  actions: read # list harness runs + download the mss32-test-harness-debug artifact

jobs:
  setup:
    name: Parse templates + resolve harness DLL
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.dll.outputs.run_id }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      # Sparse, no submodules: this root job only needs the parser, not the whole repo.
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          sparse-checkout: tools/test
          sparse-checkout-cone-mode: true
      - name: Resolve the test-harness DLL run
        id: dll
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          GIVEN: ${{ inputs.dll_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rid="$GIVEN"
          if [ -z "$rid" ]; then
            for id in $(gh run list --workflow test-harness.yml --branch "$BRANCH" --status completed \
                          -L 20 --json databaseId --jq '.[].databaseId' -R "$REPO"); do
              if gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[].name' 2>/dev/null | grep -qx 'mss32-test-harness-debug'; then
                rid="$id"; break
              fi
            done
          fi
          [ -n "$rid" ] || { echo "::error::no test-harness build with a live mss32-test-harness-debug artifact on '$BRANCH'"; exit 1; }
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo "::error::dll_run_id must be a numeric Actions run id"; exit 1; }
          artifact_id=$(gh api "repos/$REPO/actions/runs/$rid/artifacts" \
            --jq '.artifacts[] | select(.name == "mss32-test-harness-debug" and (.expired | not)) | .id' | head -1)
          [ -n "$artifact_id" ] || {
            echo "::error::run $rid has no live mss32-test-harness-debug artifact"
            exit 1
          }
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"
      - name: Restore game cache (extract only Templates)
        uses: actions/cache/restore@v5
        with:
          path: game.tar.gz
          key: slasher-min-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Parse template list -> matrix
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          mkdir tpl
          tar -xzf game.tar.gz -C tpl --wildcards '*/Templates/*.lua'   # only the templates, not the 2 GB game
          tpldir=$(dirname "$(find tpl -ipath '*/Templates/*.lua' | head -1)")
          echo "templates dir: $tpldir"
          npm install luaparse@0.3.1 --no-save --ignore-scripts --silent
          node tools/test/list-templates.js "$tpldir" > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  generate:
    name: ${{ matrix.template.name }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: windows-2025-vs2026
    env:
      GALLIUM_DRIVER: llvmpipe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
          sparse-checkout: tools
          sparse-checkout-cone-mode: true
      - name: Get the test-harness DLL (Debug)
        uses: actions/download-artifact@v8
        with:
          name: mss32-test-harness-debug
          path: dll
          run-id: ${{ needs.setup.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable DirectPlay (TCP/IP protocol for the multiplayer setup path)
        run: |
          try {
            if ((Get-WindowsOptionalFeature -Online -FeatureName DirectPlay).State -ne 'Enabled') {
              Enable-WindowsOptionalFeature -Online -FeatureName DirectPlay -All -NoRestart -ErrorAction Stop | Out-Null
            }
          } catch { Write-Host "::warning::Enable DirectPlay failed: $($_.Exception.Message)" }
      - name: Restore game from cache
        uses: actions/cache/restore@v5
        with:
          path: game.tar.gz
          key: slasher-min-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unpack game + deploy DLL + force OpenGL/ColdCPU
        run: |
          New-Item -ItemType Directory -Force -Path game | Out-Null
          tar -xzf game.tar.gz -C game
          $dir = (Get-ChildItem game -Directory | Select-Object -First 1).FullName
          Copy-Item dll\mss32.dll "$dir\mss32.dll" -Force
          $ini = Join-Path $dir 'Disciple.ini'
          if (Test-Path $ini) {
            $c = Get-Content $ini -Raw
            if ($c -match '(?m)^Renderer=')      { $c = $c -replace '(?m)^Renderer=\d+','Renderer=3' }
            elseif ($c -match '(?m)^\[Wrapper\]') { $c = $c -replace '(?m)^\[Wrapper\]',"[Wrapper]`r`nRenderer=3" }
            else                                  { $c += "`r`n[Wrapper]`r`nRenderer=3`r`n" }
            if ($c -match '(?m)^ColdCPU=')       { $c = $c -replace '(?m)^ColdCPU=\d+','ColdCPU=0' }
            elseif ($c -match '(?m)^\[Wrapper\]') { $c = $c -replace '(?m)^\[Wrapper\]',"[Wrapper]`r`nColdCPU=0" }
            Set-Content -Path $ini -Value $c -Encoding ASCII -NoNewline
          }
          "GAME_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Deploy Mesa3D software OpenGL (llvmpipe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = $env:GAME_DIR
          $asset = (gh api repos/pal1000/mesa-dist-win/releases/latest | ConvertFrom-Json).assets |
            Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          $z = Join-Path $env:TEMP 'mesa.7z'
          Invoke-WebRequest $asset.browser_download_url -OutFile $z -UseBasicParsing
          $ex = Join-Path $env:TEMP 'mesa'
          $sevenzip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenzip) { $sevenzip = 'C:\Program Files\7-Zip\7z.exe' }
          & $sevenzip x $z "-o$ex" -y "x86" | Out-Null
          Copy-Item "$ex\x86\*.dll" $dir -Force -ErrorAction SilentlyContinue
      - name: Generate + load template ${{ matrix.template.index }} (${{ matrix.template.name }})
        env:
          T_INDEX: ${{ matrix.template.index }}
          T_NAME: ${{ matrix.template.name }}
          WAIT_SEC: ${{ inputs.wait_sec }}
        run: |
          node --version
          $waitSec = [int]$env:WAIT_SEC
          if ($waitSec -lt 1 -or $waitSec -gt 600) { throw "wait_sec must be 1..600" }
          # Run the scenario in a child pwsh: its explicit `exit 1` must not terminate this wrapper
          # before the outcome row is persisted for the aggregate summary.
          $ErrorActionPreference = 'Continue'
          # Capture every stream so the GEN_OUTCOME line is readable. (The sol3 panic prints to the
          # game's stderr and stays in the raw job log.)
          $out = & "$PSHOME\pwsh.exe" -NoLogo -NoProfile -NonInteractive `
            -File ./tools/test/scenario-generation.ps1 -GameDir "$env:GAME_DIR" `
            -Template $env:T_INDEX -WaitGenerationSec $waitSec -ToMap 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $oc = $out | Select-String '^GEN_OUTCOME=' | Select-Object -Last 1
          $status = if ($oc) { ($oc.Line -replace '^GEN_OUTCOME=', '') } else { "failed (exit $code, no outcome line)" }
          $sc = $out | Select-String '^GEN_SECONDS=' | Select-Object -Last 1
          $secs = if ($sc) { ($sc.Line -replace '^GEN_SECONDS=', '') } else { '' }
          New-Item -ItemType Directory -Force outcome | Out-Null
          # index<TAB>name<TAB>outcome<TAB>generation-seconds; the summarize job assembles the table
          ("{0}`t{1}`t{2}`t{3}`n" -f $env:T_INDEX, $env:T_NAME, $status, $secs) | Set-Content "outcome/$($env:T_INDEX).tsv" -Encoding utf8 -NoNewline
          Write-Host "::notice title=$($env:T_NAME)::$status"
          # Templates come from the external game cache and have no all-green baseline. Preserve known
          # generator outcomes in the table without making every Barton harness PR permanently red. A
          # relay/client/action failure, an unrecognized result, a map-load failure, or a missing row stays hard.
          $green = $status -eq 'reached map'
          $knownFailure = $status -match '^error box:' -or
            $status -match '^no result in \d+s' -or
            $status -match '^crashed \(generator assert\) \| \[crt-assert\]' -or
            $status -match '^sol3 panic \(errored on the generator form\) \| \[stderr\]'
          if (-not $oc -or (-not $green -and -not $knownFailure) -or ($green -and $code -ne 0) -or ($knownFailure -and $code -eq 0)) {
            throw "template harness produced an inconsistent/unrecognized outcome '$status' (child exit $code)"
          }
          if ($knownFailure) { Write-Warning "template outcome is non-green (recorded above; child exit $code)" }
          exit 0 # clear the child pwsh's LASTEXITCODE; the Actions pwsh footer would otherwise re-propagate it
      - name: Upload this template's outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gen-outcome-${{ matrix.template.index }}
          path: outcome/*.tsv
          retention-days: 1 # ephemeral scratch (one row) the summarize job merges; do not let it linger
          if-no-files-found: warn

  # Aggregate every template's outcome into one table in the run summary.
  summarize:
    name: Results summary
    needs: [setup, generate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect per-template outcomes
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: gen-outcome-*
          path: outcomes
          merge-multiple: true
      - name: Build the results table
        shell: bash
        env:
          EXPECTED_MATRIX: ${{ needs.setup.outputs.matrix }}
        run: |
          missing=0
          {
            echo "## Random-scenario generation + map load, per template"
            echo ""
            echo "> Known generator outcomes over the external game cache are informational; harness/map-load failures and missing artifacts still fail CI."
            echo ""
            echo "| | # | Template | Time | Outcome |"
            echo "|:--:|--:|---|--:|---|"
            while IFS=$'\t' read -r idx name; do
              row="outcomes/$idx.tsv"
              if [ ! -f "$row" ]; then
                echo "| ❌ | $idx | $name | - | infrastructure failure: no outcome artifact |"
                missing=1
                continue
              fi
              IFS=$'\t' read -r actual_idx actual_name status secs < "$row"
              idx="$actual_idx"; name="$actual_name"
              [ -z "$name" ] && continue
              mode="${status%% | *}"                          # the part before the first " | "
              case "$mode" in
                "reached map") icon='✅' ;;                  # generated, accepted, started and loaded
                "no result"*) icon='⏳' ;;                    # never finished in the budget
                *)            icon='❌' ;;                    # crashed / sol3 / error box
              esac
              # generation seconds, capped at two digits (99+s) per the requested format
              if [ -z "$secs" ]; then t='-'; elif [ "$secs" -gt 99 ] 2>/dev/null; then t='99+s'; else t="${secs}s"; fi
              detail=$(printf '%s' "$status" | tr '|' '/')    # a literal | would split the table cell
              echo "| $icon | $idx | $name | $t | ${detail:0:150} |"
            done < <(printf '%s' "$EXPECTED_MATRIX" | jq -r '.[] | [.index,.name] | @tsv')
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          [ "$missing" -eq 0 ] || exit 1
