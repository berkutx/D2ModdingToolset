name: tests

# Reusable test suite for the DebugTest build. Called by mss32.yml after the
# DebugTest DLL is built (uses:), so it sees that DLL as a same-run artifact;
# also dispatchable on its own. Several test jobs run in parallel against the
# minimal standalone game (restored from cache). Validates the open question:
# does the game reach DLG_MAIN_MENU on a headless GitHub windows runner?

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Warm the ~1.95 GB minimal game into the Actions cache once per run/branch.
  # ubuntu does the download; the windows test jobs restore it (cross-OS archive).
  # A same-branch cache is readable on that branch, so this self-warms on a feature
  # branch — no default-branch dispatch needed.
  prep-game:
    name: Prepare game (cache)
    runs-on: ubuntu-latest
    steps:
      - name: Restore (skip download on a hit)
        id: c
        uses: actions/cache/restore@v4
        with:
          path: game.tar.gz
          key: slasher-min-v1
          enableCrossOsArchive: true
      - name: Set up Python
        if: steps.c.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download from the public HF bucket
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          pip install -U "huggingface_hub[cli]" >/dev/null
          hf buckets cp "hf://buckets/berkut/d2_slasher_mini/slasher_mns_2_4_min.tar.gz" game.tar.gz
          ls -l game.tar.gz
          sha256sum game.tar.gz
      - name: Save cache
        if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: game.tar.gz
          key: slasher-min-v1
          enableCrossOsArchive: true

  smoke:
    name: Smoke — headless boot (1x)
    needs: prep-game
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false, fetch-depth: 1 }
      - name: Get DebugTest DLL (same-run artifact)
        uses: actions/download-artifact@v5
        with: { name: mss32-debugtest, path: dll }
      - name: Restore game from cache
        uses: actions/cache/restore@v4
        with:
          path: game.tar.gz
          key: slasher-min-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unpack game + deploy DebugTest mss32.dll
        run: |
          New-Item -ItemType Directory -Force -Path game | Out-Null
          tar -xzf game.tar.gz -C game
          $dir = (Get-ChildItem game -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$dir\Discipl2.exe")) { Write-Error "Discipl2.exe missing"; exit 1 }
          if (-not (Test-Path "$dir\Mss23.dll"))   { Write-Error "Mss23.dll (renamed Miles) missing"; exit 1 }
          Copy-Item dll\mss32.dll "$dir\mss32.dll" -Force
          "GAME_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Boot once -> DLG_MAIN_MENU
        run: ./tools/test/reliability_test.ps1 -N 1 -Boot 1 -TimeoutSec 60 -Game "$env:GAME_DIR"

  reliability:
    name: Reliability — headless boot (5x)
    needs: prep-game
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false, fetch-depth: 1 }
      - name: Get DebugTest DLL (same-run artifact)
        uses: actions/download-artifact@v5
        with: { name: mss32-debugtest, path: dll }
      - name: Restore game from cache
        uses: actions/cache/restore@v4
        with:
          path: game.tar.gz
          key: slasher-min-v1
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unpack game + deploy DebugTest mss32.dll
        run: |
          New-Item -ItemType Directory -Force -Path game | Out-Null
          tar -xzf game.tar.gz -C game
          $dir = (Get-ChildItem game -Directory | Select-Object -First 1).FullName
          Copy-Item dll\mss32.dll "$dir\mss32.dll" -Force
          "GAME_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Boot 5x -> DLG_MAIN_MENU
        run: ./tools/test/reliability_test.ps1 -N 5 -Boot 1 -TimeoutSec 60 -Game "$env:GAME_DIR"

  # Future tests go here as more jobs (e.g. menu auto-nav, two-instance MP pair) —
  # each: download the DLL artifact, restore the game cache, deploy, run a script.
