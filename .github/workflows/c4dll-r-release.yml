name: c4dll-r release

# Publishes C4dll-R as a downloadable GitHub Release (a ready-to-drop-in zip), so users get it from
# the Releases page instead of digging through Actions artifacts. This is INDEPENDENT of the mss32
# mod: it has its own tag namespace (c4dll-r-v*), so the renderer and the mod are versioned and
# released separately - it is fine for their version numbers to diverge.
#
#   Cut a release:  git tag c4dll-r-v2.0 && git push origin c4dll-r-v2.0
#   Test build:     run this workflow manually (Actions -> "c4dll-r release" -> Run workflow);
#                   it publishes a *prerelease* tagged c4dll-r-dev-<sha> (or your label).

on:
  push:
    tags:
      - "c4dll-r-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Label for a manual prerelease (e.g. v2.0-rc1); blank = dev-<sha>"
        required: false
        default: ""

permissions:
  contents: write # create releases + upload assets

concurrency:
  group: c4dll-r-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + publish C4dll-R
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      # Only the cnc-ddraw submodule is needed for this build (not the mss32 deps); init it explicitly.
      # No --depth: the submodule is pinned at an exact commit that may not stay at the branch tip.
      - name: Init cnc-ddraw submodule
        run: git submodule update --init -- c4ddraw/upstream/cnc-ddraw

      # Version is computed BEFORE the build so build.ps1 can stamp it into the DLL version
      # resource. Only a real tag PUSH makes a full release; a manual dispatch (even from a tag
      # ref) and any rc/alpha/beta/dev version are prereleases.
      - name: Compute version
        id: ver
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $ver = $tag -replace '^c4dll-r-', ''
          } else {
            $label = "${{ github.event.inputs.version }}".Trim()
            if (-not $label) { $label = "dev-$(git rev-parse --short HEAD)" }
            $ver = $label
            $tag = "c4dll-r-$ver"
          }
          $isPreVer = $ver -match '(?i)(^|[.-])(rc|alpha|beta|dev)\d*([.-]|$)'
          $pre = if ($env:GITHUB_EVENT_NAME -ne 'push' -or $isPreVer) { "true" } else { "false" }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "ver=$ver" | Out-File $env:GITHUB_OUTPUT -Append
          "pre=$pre" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version $ver (tag $tag, prerelease=$pre)"

      - name: Validate texture palette colors
        run: ./c4ddraw/tests/run-palette-colors-tests.ps1

      - name: Validate filter defaults
        run: ./c4ddraw/tests/run-filter-defaults-tests.ps1

      - name: Validate timer expiry and post-battle transitions
        run: |
          ./c4ddraw/tests/run-timer-drag-tests.ps1
          ./c4ddraw/tests/run-timer-auto-drag-tests.ps1
          ./c4ddraw/tests/run-timer-end-day-tests.ps1
          ./c4ddraw/tests/run-timer-post-battle-tests.ps1

      - name: Build C4dll-R.dll + Timer + Twitch Stat
        run: |
          # Same released build a dev runs: monolith (steps 1-6), Timer and Twitch Stat (7).
          # -Version stamps the release version into the DLL version resource (res.rc + git.h).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64 -no_logo'
          ./c4ddraw/build.ps1 -Version "${{ steps.ver.outputs.ver }}"
          if (-not (Test-Path "c4ddraw/build/cnc-ddraw/bin/Release/C4dll-R.dll")) { Write-Error "C4dll-R.dll missing"; exit 1 }
          if (-not (Test-Path "c4ddraw/plugins/timer/bin/Release/timer.c4p")) { Write-Error "timer.c4p missing"; exit 1 }
          if (-not (Test-Path "c4ddraw/plugins/unitinfo/bin/Release/twitchstat.c4p")) { Write-Error "twitchstat.c4p missing"; exit 1 }

      - name: Validate minimal network diagnostics
        run: |
          ./c4ddraw/tests/test-netboundarytrace.ps1
          ./c4ddraw/tests/run-net-turn-trace-tests.ps1
          ./c4ddraw/tests/run-nettraceframe-tests.ps1
          ./c4ddraw/tests/test-c4trace.ps1
          python -m unittest discover -s c4ddraw/tests -p test_analyze_event_trace.py
          if ($LASTEXITCODE -ne 0) { throw 'Network trace analyzer tests failed' }

      - name: Validate Twitch protocol and embedded transport
        run: |
          node --test twitch-extension/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Twitch web tests failed' }
          ./twitch-extension/tools/test-native-bridge.ps1
          ./c4ddraw/tests/test-stable-release.ps1

      - name: Package drop-in zip
        id: pkg
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ steps.ver.outputs.ver }}"
          $zip = "C4dll-R-$ver.zip"
          $stage = "pkg/C4dll-R-$ver"
          New-Item -ItemType Directory -Force -Path "$stage/Mods" | Out-Null
          Copy-Item "c4ddraw/build/cnc-ddraw/bin/Release/C4dll-R.dll" "$stage/C4dll-R.dll"
          Copy-Item "c4ddraw/plugins/timer/bin/Release/timer.c4p" "$stage/Mods/timer.c4p"
          Copy-Item "c4ddraw/plugins/unitinfo/bin/Release/twitchstat.c4p" "$stage/Mods/twitchstat.c4p"
          Copy-Item "twitch-extension/STREAMER-RU.md" "$stage/TWITCH-STREAMER-RU.md"
          Copy-Item "c4ddraw/release/INSTALL.txt" "$stage/INSTALL.txt"
          Copy-Item "c4ddraw/MESSAGE_BATCHING.md" "$stage/MESSAGE_BATCHING.md"
          Copy-Item "c4ddraw/NETWORK_TRACE.md" "$stage/NETWORK_TRACE.md"
          New-Item -ItemType Directory -Force -Path "$stage/Tools" | Out-Null
          Copy-Item "c4ddraw/tools/analyze-event-trace.py" "$stage/Tools/analyze-event-trace.py"
          # Resolve once: the archive and GitHub page must carry identical notes.
          $notes = (Get-Content "c4ddraw/release/RELEASE_NOTES.md" -Raw -Encoding utf8).Replace('__VER__', $ver).Replace('__ZIP__', $zip)
          if ($notes -match '__(VER|ZIP)__') { throw 'Unresolved release-note tokens' }
          $notesPath = "$stage/RELEASE_NOTES.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          Copy-Item "c4ddraw/release/C4PLUGINS.txt" "$stage/C4PLUGINS.txt"
          Copy-Item "c4ddraw/release/C4plugins.ini" "$stage/C4plugins.ini"
          Copy-Item "c4ddraw/release/ddraw.ini" "$stage/ddraw.ini"
          Copy-Item "c4ddraw/release/Shaders" "$stage/Shaders" -Recurse
          # The menu has nine primary GLSL files plus required FSR/xBRZ second passes. Validate the
          # staged player payload itself so an incomplete directory can never become the expected ZIP.
          $shaderContract = ./c4ddraw/tools/validate-shader-bundle.ps1 -BundleRoot $stage -RequireExactShaderSet
          Copy-Item "c4ddraw/release/THIRD_PARTY_NOTICES.txt" "$stage/THIRD_PARTY_NOTICES.txt"
          Copy-Item "LICENSE" "$stage/LICENSE"
          Compress-Archive -Path "$stage" -DestinationPath $zip -Force
          # Inspect the actual player archive, not just copy commands: stale stage files must not leak.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $runtimeArchive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zip))
          try {
            $archiveFiles = @($runtimeArchive.Entries | Where-Object { -not $_.FullName.EndsWith('/') } |
              ForEach-Object { $_.FullName.Replace('\', '/') })
            $expectedFiles = @('C4dll-R.dll', 'Mods/timer.c4p', 'Mods/twitchstat.c4p',
              'TWITCH-STREAMER-RU.md', 'INSTALL.txt', 'MESSAGE_BATCHING.md', 'NETWORK_TRACE.md', 'Tools/analyze-event-trace.py',
              'RELEASE_NOTES.md', 'C4PLUGINS.txt', 'C4plugins.ini', 'ddraw.ini',
              'THIRD_PARTY_NOTICES.txt', 'LICENSE')
            $shaderRoot = (Resolve-Path 'c4ddraw/release/Shaders').Path
            $expectedFiles += @(Get-ChildItem -LiteralPath $shaderRoot -Recurse -File |
              ForEach-Object { 'Shaders/' + $_.FullName.Substring($shaderRoot.Length + 1).Replace('\', '/') })
            $expectedFiles = @($expectedFiles | ForEach-Object { "C4dll-R-$ver/$_" })
            if ($archiveFiles.Count -ne $expectedFiles.Count -or
                @(Compare-Object $expectedFiles $archiveFiles).Count -ne 0) {
              throw 'Runtime ZIP has missing or unexpected files outside the release allowlist.'
            }
            $plugins = @($runtimeArchive.Entries | Where-Object { $_.FullName -match '(?i)\.c4p$' })
            $expectedPlugins = @("C4dll-R-$ver/Mods/timer.c4p", "C4dll-R-$ver/Mods/twitchstat.c4p")
            $actualPlugins = @($plugins | ForEach-Object { $_.FullName.Replace('\', '/') })
            if ($actualPlugins.Count -ne 2 -or @(Compare-Object $expectedPlugins $actualPlugins).Count -ne 0) {
              throw 'Runtime ZIP must contain exactly Mods/timer.c4p and Mods/twitchstat.c4p.'
            }
            if ($archiveFiles -notcontains "C4dll-R-$ver/TWITCH-STREAMER-RU.md") { throw 'Twitch streamer instructions missing from runtime ZIP.' }
            $expectedShaders = @($shaderContract.RequiredPaths | ForEach-Object {
              "C4dll-R-$ver/" + $_.Replace('\', '/')
            })
            $actualShaders = @($archiveFiles | Where-Object { $_ -match '(?i)/Shaders/.+\.glsl(?:\.pass1)?$' })
            if ($actualShaders.Count -ne $expectedShaders.Count -or
                @($expectedShaders | Where-Object { $actualShaders -notcontains $_ }).Count -ne 0) {
              throw 'Runtime ZIP is missing one or more shader menu files.'
            }
          } finally { $runtimeArchive.Dispose() }
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append
          "notes=$notesPath" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "packaged player archive $zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $ver = "${{ steps.ver.outputs.ver }}"
          $pre = "${{ steps.ver.outputs.pre }}" -eq "true"
          $zip = "${{ steps.pkg.outputs.zip }}"
          $notesPath = "${{ steps.pkg.outputs.notes }}"

          # Create the release if it does not exist yet (tag push: tag exists; dispatch: gh makes it).
          gh release view $tag 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @('release', 'create', $tag, '--title', "C4dll-R $ver", '--notes-file', $notesPath, '--target', $env:GITHUB_SHA)
            if ($pre) { $createArgs += '--prerelease' }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { Write-Error "gh release create failed"; exit 1 }
          } else {
            # The release already exists (e.g. a real tag push after an earlier manual prerelease
            # created the same tag): make the prerelease flag match THIS run.
            # Its tag already identifies the source commit. Supplying target_commitish again
            # needlessly requests workflow scope when that commit includes workflow changes.
            gh release edit $tag --title "C4dll-R $ver" --notes-file $notesPath --prerelease=$("$pre".ToLower())
            if ($LASTEXITCODE -ne 0) { Write-Error "gh release edit failed"; exit 1 }
          }

          # Player Releases expose one ready-to-use archive. PDBs and loose binaries remain only in
          # the separate technical c4ddraw Actions workflow.
          gh release upload $tag $zip --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error "gh release upload failed"; exit 1 }
          Write-Host "published release $tag (prerelease=$pre)"
