name: rdp-probe

# Diagnostic: a GitHub-HOSTED windows runner already has an ACTIVE interactive
# console session (runneradmin, id 2) — the job itself runs in service session 0,
# which is why GUI apps launched by the job get no message pump. Probe whether we
# can launch a process INTO session 2 (the interactive console) with PsExec -i 2.
# If yes, the headless MP test just launches the game there (no RDP needed). Fast,
# no build, no game. Iterate by editing this file (push-triggered).

on:
  push:
    paths:
      - ".github/workflows/rdp-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe launching into the interactive console session
    runs-on: windows-latest # standard runner = free for public repos
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Report sessions + launch a probe into session 2 via PsExec
        run: |
          $ErrorActionPreference = 'Continue'
          $jobSess = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Write-Host "JOB runs as $(whoami) in SessionId=$jobSess"
          Write-Host "`n=== query session ==="
          (query session) 2>&1 | Out-String | Write-Host

          # find the active interactive console session id
          $consoleId = (Get-CimInstance Win32_Process -Filter "Name='winlogon.exe'" |
                        ForEach-Object { $_.SessionId } | Sort-Object -Unique) -join ','
          Write-Host "winlogon session id(s): $consoleId"

          # download PsExec
          $ps = Join-Path $env:TEMP 'PsExec64.exe'
          try {
            Invoke-WebRequest -Uri 'https://live.sysinternals.com/PsExec64.exe' -OutFile $ps -UseBasicParsing
            Write-Host "PsExec downloaded: $((Get-Item $ps).Length) bytes"
          } catch { Write-Host "PsExec download failed: $_" }

          # probe script that records WHICH session it actually ran in
          $probe = Join-Path $env:TEMP 'whichsession.ps1'
          $out = Join-Path $env:TEMP 'session_result.txt'
          Remove-Item $out -ErrorAction SilentlyContinue
          $probeLines = @(
            '$s = [System.Diagnostics.Process]::GetCurrentProcess().SessionId'
            '"ran in SessionId=$s as $(whoami)" | Set-Content -Path "$env:TEMP\session_result.txt"'
          )
          $probeLines | Set-Content -Path $probe -Encoding ASCII

          Write-Host "`n=== PsExec -i 2 (launch into the interactive console) ==="
          & $ps -accepteula -nobanner -i 2 -w $env:TEMP pwsh -NoProfile -File $probe 2>&1 | Out-String | Write-Host
          Write-Host "PsExec exit=$LASTEXITCODE"
          Start-Sleep -Seconds 3
          Write-Host "=== what the launched process reported ==="
          if (Test-Path $out) { Get-Content $out | Write-Host } else { Write-Host "(no result file — launch into session 2 failed)" }
