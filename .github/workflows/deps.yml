name: deps

# Builds the rarely-changing dependency libs (Detours, SLikeNet LibStatic,
# ScenarioGenerator) and publishes them as the "deps-libs" artifact that mss32
# downloads. Runs automatically when a dependency submodule is bumped (so mss32 never
# links a stale lib), and on manual dispatch (e.g. the 90-day artifact lapsed).

on:
  push:
    # A dependency-submodule bump must rebuild these libs so mss32 links the fresh deps-libs.
    # (A D2RSG bump that skipped this is exactly what once shipped a stale ScenarioGenerator.)
    paths:
      - "D2RSG"
      - "SLikeNet"
      - "Detours"
      - ".github/workflows/deps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deps:
    name: Build dependency libs (MSVC x86)
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build Detours + SLikeNet + ScenarioGenerator
        run: |
          # Load the MSVC x86 env natively (vswhere + Enter-VsDevShell, no third-party action).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64 -no_logo'

          # Detours (x86 static lib) -> mss32\Lib. DETOURS_TARGET_PROCESSOR pins the
          # output to lib.X86; without it Detours' nmake keys off the x64 host and
          # writes lib.X64 (we cross-compile x86 from an x64 host).
          $env:DETOURS_TARGET_PROCESSOR = 'X86'
          Push-Location Detours\src; nmake; Pop-Location
          if (-not (Test-Path Detours\lib.X86\detours.lib)) { Write-Error 'detours.lib not produced'; exit 1 }
          New-Item -ItemType Directory -Force -Path mss32\Lib | Out-Null
          Copy-Item Detours\lib.X86\detours.* mss32\Lib\ -Force

          # SLikeNet LibStatic + ScenarioGenerator, Debug + Release.
          # /WX- keeps warnings non-fatal; /FS lets parallel cl share one PDB (these use /Zi).
          $env:_CL_ = '/WX- /FS'
          foreach ($cfg in 'Debug', 'Release') {
            msbuild mss32\mss32.sln '/t:LibStatic;ScenarioGenerator' `
              /p:Configuration=$cfg /p:Platform=x86 /p:PlatformToolset=v143 `
              /p:MultiProcessorCompilation=true /p:MinimalRebuild=false /m /nologo /verbosity:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem mss32\Lib

      - name: Stamp deps-libs with its source D2RSG commit
        # mss32's freshness guard compares this against its own D2RSG checkout, turning a
        # stale-lib link (green but wrong) into a loud, actionable failure.
        run: |
          (git -C D2RSG rev-parse HEAD).Trim() | Set-Content -Path mss32\Lib\D2RSG.sha -NoNewline
          Write-Host "stamped D2RSG $(Get-Content mss32\Lib\D2RSG.sha)"

      - name: Upload dependency libs
        uses: actions/upload-artifact@v7
        with:
          name: deps-libs # multiple .lib files -> keep the (default) archive; also downloaded every mss32 run
          path: mss32/Lib/
          retention-days: 90
          if-no-files-found: error
