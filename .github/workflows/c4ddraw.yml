name: c4ddraw

# Builds the monolith C4dll-R.dll as one swappable DirectDraw wrapper, from:
#   - pristine upstream cnc-ddraw (c4ddraw/upstream/cnc-ddraw submodule)
#   - the minimal cnc-ddraw-c4dll-r.patch: redirect the game's DirectDrawCreate(Ex) imports and call
#     the single c4features_install bootstrap (dllmain.c only; NO separate ddraw.dll)
#   - wrapper-owned feature sources: renderer bridge/exports, menu, Hor+, wide battle, decorative
#     background, clouds, localization, saves, cursor guard, plugins and headless mode
#     (self-contained, no mss32 dependency)
#   - renderer-specific patches: render_null, D2 defaults, Ctrl+Wheel simple zoom, filtered output
#     downscaling and the OpenGL/D3D9/GDI decorative-presentation seam
#   - the CB63 export forwarder (c4ddraw/forwarder/C4dll-R.cb63.def): all 483 CB63 exports
#   - native plugins: timer.c4p (host-driven turn clock) and twitchstat.c4p (Wide Battle LMB -> the
#     transport snapshot of all battle slots). Built by build.ps1 steps [7/8] and [8/8].
# Everything is driven by c4ddraw/build.ps1 (same script a dev runs locally). See c4ddraw/README.md.

on:
  push:
    # Release tags have their own build + publish workflow.
    branches:
      - "**"
    paths:
      - "c4ddraw/**"
      - ".github/workflows/c4ddraw.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c4ddraw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build C4dll-R.dll (MSVC x86, v143)
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      # Only the cnc-ddraw submodule is needed for this build (not the mss32 deps); init it explicitly.
      # No --depth: the submodule is pinned at an exact commit that may not stay at the branch tip.
      - name: Init cnc-ddraw submodule
        run: git submodule update --init -- c4ddraw/upstream/cnc-ddraw

      - name: Build monolith C4dll-R.dll
        run: |
          # Load the MSVC x86 env natively (vswhere + Enter-VsDevShell) so dumpbin is on PATH;
          # build.ps1 finds MSBuild itself. Same approach as mss32.yml.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64 -no_logo'

          ./c4ddraw/build.ps1

          $dll = "c4ddraw/build/cnc-ddraw/bin/Release/C4dll-R.dll"
          if (-not (Test-Path $dll)) { Write-Error "C4dll-R.dll was not produced"; exit 1 }

          # Sanity: it must forward the CB63 exports AND export our 2 renderer-bridge hooks, and must
          # NOT export DirectDrawCreate (that one is internal + IAT-hooked, the whole point).
          $exp  = & dumpbin /exports $dll
          $fwd  = ($exp | Select-String 'forwarded to CB63').Count
          $ours = ($exp | Select-String 'DDReloadConfig|DDTakeScreenshot').Count
          $ddc  = ($exp | Select-String '\bDirectDrawCreate\b').Count
          Write-Host "C4dll-R.dll: $fwd CB63 forwards, $ours custom exports, DirectDrawCreate exported=$ddc, $((Get-Item $dll).Length) bytes"
          if ($fwd -lt 480) { Write-Error "expected >=480 CB63 forwards, got $fwd"; exit 1 }
          if ($ours -lt 2)  { Write-Error "DDReloadConfig/DDTakeScreenshot exports missing"; exit 1 }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $dll out/C4dll-R.dll

          # Native plugins (built by build.ps1 steps [7/8] and [8/8]) - verify their c4p_* exports.
          $c4p = "c4ddraw/plugins/timer/bin/Release/timer.c4p"
          if (-not (Test-Path $c4p)) { Write-Error "timer.c4p was not produced"; exit 1 }
          $pexp = (& dumpbin /exports $c4p | Select-String 'c4p_query|c4p_init|c4p_tick|c4p_draw|c4p_shutdown').Count
          Write-Host "timer.c4p: $pexp/5 c4p exports, $((Get-Item $c4p).Length) bytes"
          if ($pexp -lt 5) { Write-Error "timer.c4p missing c4p_* exports ($pexp/5)"; exit 1 }
          Copy-Item $c4p out/timer.c4p

          $twitchstat = "c4ddraw/plugins/unitinfo/bin/Release/twitchstat.c4p"
          if (-not (Test-Path $twitchstat)) { Write-Error "twitchstat.c4p was not produced"; exit 1 }
          $uexp = (& dumpbin /exports $twitchstat | Select-String 'c4p_query|c4p_init|c4p_draw|c4p_mouse').Count
          Write-Host "twitchstat.c4p: $uexp/4 required c4p exports, $((Get-Item $twitchstat).Length) bytes"
          if ($uexp -lt 4) { Write-Error "twitchstat.c4p missing required c4p_* exports ($uexp/4)"; exit 1 }
          Copy-Item $twitchstat out/twitchstat.c4p

          # keep the matching symbols for crash triage
          Copy-Item "c4ddraw/build/cnc-ddraw/bin/Release/C4dll-R.pdb" out/C4dll-R.pdb
          Copy-Item "c4ddraw/plugins/timer/bin/Release/timer.pdb" out/timer.pdb
          Copy-Item "c4ddraw/plugins/unitinfo/bin/Release/twitchstat.pdb" out/twitchstat.pdb

      - name: Upload C4dll-R.dll
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: C4dll-R.dll
          path: out/C4dll-R.dll
          if-no-files-found: warn
          archive: false

      - name: Upload timer.c4p
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: timer.c4p
          path: out/timer.c4p
          if-no-files-found: warn
          archive: false

      - name: Upload twitchstat.c4p
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: twitchstat.c4p
          path: out/twitchstat.c4p
          if-no-files-found: warn
          archive: false

      - name: Upload PDB symbols
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pdb-symbols
          path: |
            out/C4dll-R.pdb
            out/timer.pdb
            out/twitchstat.pdb
          if-no-files-found: warn
