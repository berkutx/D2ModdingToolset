name: cache-game

# Warms the Actions cache with the minimal standalone Disciples 2 build from the
# PUBLIC HuggingFace bucket (buckets/berkut/d2_slasher_mini, ~1.95 GB, 1 file).
# The 'tests' workflow restores this cache instead of re-downloading 1.95 GB every
# run. Run this once, and again after the game is updated (bump `version`).
#
# DISPATCH THIS ON THE DEFAULT BRANCH: a cache created on the default branch is
# restorable from every branch (incl. feature/test-harness); a feature-branch cache
# is not shared. enableCrossOsArchive lets the windows 'tests' job restore a cache
# saved here on Linux.
#
# Cache mechanics recap: actions/cache restores at start, saves at end ONLY on a key
# MISS, and keys are immutable — to refresh, bump `version` (changes the key).
#
# Runner: ubuntu-latest (has python+pip for the hf CLI, and ~14 GB free for the
# ~1.95 GB download + ~2 GB cache). ubuntu-slim works too IF it has python + disk.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Cache version tag — bump to force a re-download"
        default: "v1"
      expected_sha256:
        description: "Optional: pin the tarball sha256 to verify the download"
        default: ""

permissions:
  contents: read

jobs:
  warm:
    name: Download + cache the minimal game
    runs-on: ubuntu-latest
    steps:
      - name: Restore (skip download on a cache hit)
        id: c
        uses: actions/cache/restore@v4
        with:
          path: game.tar.gz
          key: slasher-min-${{ github.event.inputs.version }}
          enableCrossOsArchive: true

      - name: Set up Python
        if: steps.c.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download from the HF bucket + verify
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          pip install -U "huggingface_hub[cli]" >/dev/null
          hf buckets cp "hf://buckets/berkut/d2_slasher_mini/slasher_mns_2_4_min.tar.gz" game.tar.gz
          ls -l game.tar.gz
          sum=$(sha256sum game.tar.gz | cut -d' ' -f1)
          echo "sha256=$sum"
          exp="${{ github.event.inputs.expected_sha256 }}"
          if [ -n "$exp" ] && [ "$exp" != "$sum" ]; then
            echo "::error::sha256 mismatch: expected $exp, got $sum"; exit 1
          fi
          # sanity: the tarball should contain a standalone game folder
          tar -tzf game.tar.gz | head -5

      - name: Save cache
        if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: game.tar.gz
          key: slasher-min-${{ github.event.inputs.version }}
          enableCrossOsArchive: true
