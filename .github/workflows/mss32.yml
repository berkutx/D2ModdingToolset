name: mss32

# Build orchestrator. Builds all three configs in parallel:
#   - Debug, Release  : compile checks only (do the sources still build?).
#   - DebugTest       : the publishable D2_TESTDRV test/logging system; its DLL is
#                       uploaded and then handed to the separate 'tests' workflow.
# The heavy deps are not rebuilt here — they come from the latest successful "deps"
# run as the "deps-libs" artifact (run "deps" once first).
#
# Triggers ONLY on DLL sources (mss32/**). Test-script-only changes (tools/**, the test
# suite) go through tests-only.yml, which REUSES this build's DebugTest DLL instead of
# rebuilding it — so editing the dispatcher/relay/test logic skips the ~10-min compile.

on:
  push:
    paths:
      - "mss32/**"
      - ".github/workflows/mss32.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download the deps-libs artifact

concurrency:
  group: mss32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Pre-checks (submodules)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1
      - name: Verify submodule wiring
        shell: bash # ubuntu-slim has no pwsh
        run: |
          set -e
          n=$(git submodule status | wc -l)
          echo "submodules wired: $n"
          [ "$n" -ge 7 ] || { echo "::error::expected >=7 submodules, found $n"; exit 1; }

  # Debug + Release: just prove the sources compile (no artifact, no tests).
  compile:
    name: Compile ${{ matrix.configuration }}
    needs: prepare
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Fetch deps-libs from the latest 'deps' run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rid = (gh run list --workflow deps.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId').Trim()
          if (-not $rid) { Write-Error "No successful 'deps' run found; run the 'deps' workflow once."; exit 1 }
          gh run download $rid -n deps-libs -D mss32/Lib
      - name: Build ${{ matrix.configuration }} (compile check)
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64 -no_logo'
          $env:_CL_ = '/WX- /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS'
          $env:DISCIPLES2_PATH = "$env:GITHUB_WORKSPACE\out\"
          New-Item -ItemType Directory -Force -Path $env:DISCIPLES2_PATH | Out-Null
          msbuild mss32\mss32.vcxproj `
            /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform=Win32 /p:PlatformToolset=v143 `
            /p:SolutionDir=$env:GITHUB_WORKSPACE\mss32\ `
            /p:MultiProcessorCompilation=false /p:UseMultiToolTask=true `
            /p:EnforceProcessCountAcrossBuilds=true /p:MinimalRebuild=false `
            /m /nologo /clp:Summary /verbosity:minimal
          exit $LASTEXITCODE

  # DebugTest: build the test/logging system and publish the DLL for the tests.
  build-debugtest:
    name: Build DebugTest
    needs: prepare
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Fetch deps-libs from the latest 'deps' run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rid = (gh run list --workflow deps.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId').Trim()
          if (-not $rid) { Write-Error "No successful 'deps' run found; run the 'deps' workflow once."; exit 1 }
          gh run download $rid -n deps-libs -D mss32/Lib
      - name: Build DebugTest (D2_TESTDRV)
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64 -no_logo'
          $env:_CL_ = '/WX- /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS'
          $env:DISCIPLES2_PATH = "$env:GITHUB_WORKSPACE\out\"
          New-Item -ItemType Directory -Force -Path $env:DISCIPLES2_PATH | Out-Null
          msbuild mss32\mss32.vcxproj `
            /t:Build /p:Configuration=DebugTest /p:Platform=Win32 /p:PlatformToolset=v143 `
            /p:SolutionDir=$env:GITHUB_WORKSPACE\mss32\ `
            /p:MultiProcessorCompilation=false /p:UseMultiToolTask=true `
            /p:EnforceProcessCountAcrossBuilds=true /p:MinimalRebuild=false `
            /m /nologo /clp:Summary /verbosity:minimal
          exit $LASTEXITCODE
      - name: Verify the test/logging system is present
        run: |
          $txt = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes("out\mss32.dll"))
          foreach ($m in '[testdrv]', '[nettrace]', 'skip-intro') {
            if (-not $txt.Contains($m)) { Write-Error "missing test/logging marker: $m"; exit 1 }
          }
          Write-Host "test/logging system present"
      - name: Upload DebugTest DLL
        # Default archiving (zip) — download-artifact extracts it in the tests job.
        # (archive:false yields a raw artifact that download-artifact cannot extract.)
        uses: actions/upload-artifact@v7
        with:
          name: mss32-debugtest
          path: out/mss32.dll
          if-no-files-found: warn

  # Separate test suite — runs after the DebugTest build, consuming its DLL.
  tests:
    name: Tests
    needs: build-debugtest
    uses: ./.github/workflows/tests.yml
    secrets: inherit
