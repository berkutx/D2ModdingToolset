name: mss32-manual

# Ad-hoc production build entrypoint. Automated PR/default-branch coverage lives in
# test-harness.yml so one commit does not create two competing CI runs.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Production configuration to build"
        type: choice
        required: true
        default: Release
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: mss32-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Production Debug
    if: ${{ inputs.configuration == 'Debug' }}
    uses: ./.github/workflows/mss32-production-build.yml
    with:
      configuration: Debug
      artifact_name: mss32-production-debug

  release:
    name: Production Release
    if: ${{ inputs.configuration == 'Release' }}
    uses: ./.github/workflows/mss32-production-build.yml
    with:
      configuration: Release
      artifact_name: mss32-production-release
