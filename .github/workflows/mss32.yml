name: mss32

# Builds mss32.dll. The heavy deps are not rebuilt here — they come from the
# latest successful "deps" run as the "deps-libs" artifact.

on:
  push:
    paths:
      - "mss32/**"
      - "tests/**"
      - "tools/simturns-relay/**"
      - "tools/relay/**"
      - "tools/test/**"
      - "Examples/Custom Lobby/CustomLobby.dlg"
      - "Examples/Custom Lobby/CustomLobby.ff"
      - ".github/workflows/mss32.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "mss32/**"
      - "tests/**"
      - "tools/simturns-relay/**"
      - "tools/relay/**"
      - "tools/test/**"
      - "Examples/Custom Lobby/CustomLobby.dlg"
      - "Examples/Custom Lobby/CustomLobby.ff"
      - ".github/workflows/mss32.yml"

permissions:
  contents: read
  actions: read # to download the deps-libs artifact

concurrency:
  group: mss32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Pre-checks (submodules)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
      - name: Verify submodule wiring
        shell: bash # ubuntu-slim has no pwsh
        run: |
          set -e
          n=$(git submodule status | wc -l)
          echo "submodules wired: $n"
          [ "$n" -ge 7 ] || { echo "::error::expected >=7 submodules, found $n"; exit 1; }

  build:
    name: ${{ matrix.configuration }} OH=${{ matrix.simturns }} TH=${{ matrix.testdrv }}
    needs: prepare
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        simturns: ['false', 'true']
        configuration: [Debug, Release]
        testdrv: ['false']
        include:
          - configuration: DebugTest
            simturns: 'false'
            testdrv: 'true'
          - configuration: DebugTest
            simturns: 'true'
            testdrv: 'true'
          - configuration: Release
            simturns: 'true'
            testdrv: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch deps-libs from the latest 'deps' run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rid = (gh run list --workflow deps.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId').Trim()
          if (-not $rid) { Write-Error "No successful 'deps' run found; run the 'deps' workflow once."; exit 1 }
          gh run download $rid -n deps-libs -D mss32/Lib
          Get-ChildItem mss32/Lib

      - name: Build mss32.dll
        run: |
          # Load the MSVC x86 env natively (vswhere + Enter-VsDevShell, no third-party action).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64 -no_logo'

          # /WX- keeps newer-MSVC warnings non-fatal; the define quiets fmt v7's C4996.
          $env:_CL_ = '/WX- /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS'
          $env:DISCIPLES2_PATH = "$env:GITHUB_WORKSPACE\out\"
          New-Item -ItemType Directory -Force -Path $env:DISCIPLES2_PATH | Out-Null

          # Speed comes from the PCH + /Z7 + per-file parallel tasks (set in mss32.vcxproj).
          msbuild mss32\mss32.vcxproj `
            /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform=Win32 /p:PlatformToolset=v143 `
            /p:SolutionDir=$env:GITHUB_WORKSPACE\mss32\ `
            /p:EnableSimultaneousTurns=${{ matrix.simturns }} `
            /p:D2TestDrv=${{ matrix.testdrv }} `
            /p:MultiProcessorCompilation=false /p:UseMultiToolTask=true `
            /p:EnforceProcessCountAcrossBuilds=true /p:MinimalRebuild=false `
            /m /nologo /clp:Summary /verbosity:minimal 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE

      - name: OH and prepared protocol regressions
        if: matrix.simturns == 'true' && matrix.configuration == 'Release' && matrix.testdrv == 'false'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64 -no_logo'
          ./tests/run-simturns.ps1 -OutputDirectory "$env:RUNNER_TEMP/simturns-tests"
          ./tests/run-turn-script-optional.ps1
          ./tests/run-prepared-match-protocol.ps1 -OutputDirectory "$env:RUNNER_TEMP/prepared-tests" -DependenciesRoot $env:GITHUB_WORKSPACE
          ./tests/run-item-potion-fields.ps1 -OutputDirectory "$env:RUNNER_TEMP/potion-fields-tests"
          Push-Location tools/simturns-relay
          try { node --test; if ($LASTEXITCODE -ne 0) { throw 'Relay regression failed' } }
          finally { Pop-Location }
          Push-Location tools/relay
          try { node --test; if ($LASTEXITCODE -ne 0) { throw 'Harness relay regression failed' } }
          finally { Pop-Location }
          ./tools/test/simturns-production-poc.ps1 -StaticCheck
          ./tools/test/simturns-acceptance-campaign.ps1 -StaticCheck -GameDir . -FixtureManifest ./tools/test/fixtures/simturns-russobit.json -ArtifactDir "$env:RUNNER_TEMP/campaign-static"
          ./tools/test/lobby-simturns-smoke.ps1 -StaticCheck
          ./tools/test/simturns-battle-cases-test.ps1
          ./tools/test/legacy-mass-oracle-test.ps1
          ./tools/test/literal-inner-startup-test.ps1
          node --test tools/test/battle-trace-audit.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Battle trace regression failed' }

      # archive: false uploads the file as-is (no zip). It only supports a single
      # file, so the build outputs go up as separate artifacts.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.configuration }}-oh-${{ matrix.simturns }}-th-${{ matrix.testdrv }}.log
          path: build.log
          if-no-files-found: ignore
          archive: false

      - name: Upload mss32.dll
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mss32-${{ matrix.configuration }}-oh-${{ matrix.simturns }}-th-${{ matrix.testdrv }}.dll
          path: out/mss32.dll
          if-no-files-found: error
          archive: false

      - name: Upload mss32.pdb
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mss32-${{ matrix.configuration }}-oh-${{ matrix.simturns }}-th-${{ matrix.testdrv }}.pdb
          path: out/mss32.pdb
          if-no-files-found: error
          archive: false
