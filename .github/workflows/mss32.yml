name: mss32

# Builds mss32.dll (the mod). The heavy dependency libs are NOT rebuilt here —
# they are pulled from the latest successful "deps" workflow run as the
# "deps-libs" artifact. Only mss32 itself is compiled, so this is fast and runs
# on every push (feature branches included). If no deps artifact exists yet,
# run the "deps" workflow once first.

on:
  push:
    paths:
      - "mss32/**"
      - ".github/workflows/mss32.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to download the deps-libs artifact from the deps workflow

# A new push to the same branch supersedes the previous one: cancel the
# in-flight run instead of burning a second Windows runner on stale code.
concurrency:
  group: mss32-${{ github.ref }}
  cancel-in-progress: true

env:
  # ilammy/msvc-dev-cmd is still a Node 20 action; the checkout/upload actions
  # below are already Node 24. Forcing Node 24 for all JS actions clears the
  # "Node.js 20 actions are deprecated" warning without waiting on upstream.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Cheap Ubuntu gate: verify the checkout + submodules before the Windows runner.
  prepare:
    name: Pre-checks (submodules)
    # 1-vCPU container runner (GA 2026-01-22) — ideal for this lightweight gate.
    runs-on: ubuntu-slim
    steps:
      - name: Checkout (superproject only — no submodule content)
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
      - name: Verify submodule wiring (no content download)
        run: |
          set -e
          test -f .gitmodules
          git submodule status
          n=$(git submodule status | wc -l)
          echo "submodules wired: $n"
          [ "$n" -ge 7 ] || { echo "::error::expected >=7 submodules, found $n"; exit 1; }

  build:
    name: Build mss32.dll (Windows / MSVC x86)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch dependency libs from the latest 'deps' run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rid=$(gh run list --workflow deps.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId' || true)
          if [ -z "$rid" ]; then
            echo "::error::No successful 'deps' run found. Run the 'deps' workflow once to publish the deps-libs artifact, then re-run this."
            exit 1
          fi
          echo "Using deps-libs from deps run $rid"
          mkdir -p mss32/Lib
          gh run download "$rid" -n deps-libs -D mss32/Lib
          ls -la mss32/Lib

      - name: Set up MSVC x86 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # Compiler cache. Caches each compiled .obj keyed on the preprocessed
      # source + flags (content-based), stored in the GitHub Actions cache. A
      # push usually changes a handful of .cpp, so the other ~390 TUs + lua are
      # cache hits on the next run -> the compile collapses to near-link time.
      # The first run on a branch is a cold miss (populates the cache); the win
      # shows from the second run onward.
      - name: Set up sccache (GitHub Actions cache backend)
        uses: Mozilla-Actions/sccache-action@v0.0.10

      - name: Build mss32 via sccache (cl wrapped, per-file tasks)
        shell: cmd
        env:
          SCCACHE_GHA_ENABLED: "true"
          # A cache I/O hiccup should fall back to a normal compile, not fail CI.
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
          # Diagnostics: make the sccache server log every decision/error.
          SCCACHE_LOG: "debug"
          SCCACHE_ERROR_LOG: ${{ github.workspace }}\sccache_server.log
        run: |
          set "SCCDIR=%GITHUB_WORKSPACE%\.sccwrap"
          if not exist "%SCCDIR%" mkdir "%SCCDIR%"
          for /f "delims=" %%i in ('where sccache') do copy /Y "%%i" "%SCCDIR%\cl.exe" >nul

          echo ===== diagnostics: which cl does the build see? =====
          where cl
          echo --- real cl version ---
          cl 2>&1 | findstr /i "Microsoft Optimizing Compiler Version"
          echo --- wrapper dir contents ---
          dir "%SCCDIR%"

          echo ===== restart sccache server so it picks up SCCACHE_LOG/ERROR_LOG =====
          sccache --stop-server 2>nul
          sccache --start-server
          sccache --zero-stats

          echo ===== isolate: compile a trivial TU through the cl wrapper =====
          echo int scc_probe(){ return 0; }> "%TEMP%\sccprobe.cpp"
          "%SCCDIR%\cl.exe" /nologo /c "%TEMP%\sccprobe.cpp" /Fo"%TEMP%\sccprobe.obj"
          echo wrapper-cl exit code: %ERRORLEVEL%
          sccache --show-stats

          echo ===== full build =====
          set "_CL_=/WX- /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS"
          set "DISCIPLES2_PATH=%GITHUB_WORKSPACE%\out\"
          if not exist "%DISCIPLES2_PATH%" mkdir "%DISCIPLES2_PATH%"
          echo runner cores: %NUMBER_OF_PROCESSORS%
          msbuild mss32\mss32.vcxproj /t:Build /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143 /p:SolutionDir=%GITHUB_WORKSPACE%\mss32\ /p:MultiProcessorCompilation=false /p:UseMultiToolTask=true /p:EnforceProcessCountAcrossBuilds=true /p:CLToolExe=cl.exe /p:CLToolPath=%SCCDIR% /p:MinimalRebuild=false /m /nologo /clp:Summary /verbosity:minimal > build.log 2>&1
          set RC=%ERRORLEVEL%
          type build.log
          echo ===== sccache stats =====
          sccache --show-stats
          echo ===== sccache server log (the actual per-call errors) =====
          if exist "%GITHUB_WORKSPACE%\sccache_server.log" type "%GITHUB_WORKSPACE%\sccache_server.log"
          exit /b %RC%

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mss32-build-log
          path: build.log
          if-no-files-found: ignore
          compression-level: 0 # tiny text file — skip the zip CPU

      - name: Upload mss32.dll
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mss32-debug-x86
          path: |
            out/mss32.dll
            out/mss32.pdb
          if-no-files-found: warn
          # The .pdb dominates this artifact and barely compresses; level 0
          # stores it as-is so no runner CPU is spent zipping it.
          compression-level: 0

# warm-cache run: re-trigger to measure sccache hit-rate (no compile-input change)
